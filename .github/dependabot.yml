version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule: { interval: weekly, day: monday, time: "04:00", timezone: Asia/Novosibirsk }
    groups:
      dotnet-runtime:
        patterns: ["Microsoft.*", "Npgsql.*"]
      dotnet-tests:
        patterns: ["xunit*", "coverlet.*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /src/proxyharbor-web
    schedule: { interval: weekly, day: monday, time: "04:15", timezone: Asia/Novosibirsk }
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-development:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "04:30", timezone: Asia/Novosibirsk }
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday, time: "04:45", timezone: Asia/Novosibirsk }
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /src/ProxyHarbor.Api
    schedule: { interval: weekly, day: monday, time: "05:00", timezone: Asia/Novosibirsk }
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /src/ProxyHarbor.Restore
    schedule: { interval: weekly, day: monday, time: "05:10", timezone: Asia/Novosibirsk }
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /src/proxyharbor-web
    schedule: { interval: weekly, day: monday, time: "05:20", timezone: Asia/Novosibirsk }
    open-pull-requests-limit: 3
