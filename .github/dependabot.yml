version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule: { interval: weekly, day: monday, time: "04:00", timezone: Asia/Novosibirsk }
    groups:
      dotnet-runtime:
        patterns: ["Microsoft.*", "Npgsql.*"]
        exclude-patterns: ["Microsoft.NET.Test.Sdk"]
        update-types: ["minor", "patch"]
      dotnet-tests:
        patterns: ["xunit*", "coverlet.*", "Microsoft.NET.Test.Sdk"]
        update-types: ["minor", "patch"]
    ignore:
      # Microsoft.AspNetCore.OpenApi 10.x requires Microsoft.OpenApi < 3.0.
      - dependency-name: Microsoft.OpenApi
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /src/proxyharbor-web
    schedule: { interval: weekly, day: monday, time: "04:15", timezone: Asia/Novosibirsk }
    groups:
      frontend-runtime:
        dependency-type: production
        update-types: ["minor", "patch"]
      frontend-development:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Re-enable majors one by one after their peer dependency chains support them.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
      - dependency-name: vite-plugin-static-copy
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "04:30", timezone: Asia/Novosibirsk }
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 1

  - package-ecosystem: docker
    directories:
      - /
      - /src/ProxyHarbor.Api
      - /src/ProxyHarbor.Restore
      - /src/ProxyHarbor.CheckerAgent
      - /src/proxyharbor-web
    schedule: { interval: weekly, day: monday, time: "04:45", timezone: Asia/Novosibirsk }
    groups:
      docker-images:
        patterns: ["*"]
    ignore:
      # Major image migrations require an explicit compatibility review.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 2
