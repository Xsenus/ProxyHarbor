name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: src/proxyharbor-web/package-lock.json }
      - run: dotnet restore ProxyHarbor.slnx
      - run: dotnet build ProxyHarbor.slnx -c Release --no-restore
      - run: dotnet test ProxyHarbor.slnx -c Release --no-build --logger trx
      - run: npm ci
        working-directory: src/proxyharbor-web
      - run: npm run lint
        working-directory: src/proxyharbor-web
      - run: npm test
        working-directory: src/proxyharbor-web
      - run: npm run build
        working-directory: src/proxyharbor-web
      - run: docker compose config
        env:
          POSTGRES_DB: proxyharbor
          POSTGRES_USER: proxyharbor
          POSTGRES_PASSWORD: ci-password
          ADMIN_API_KEY: ci-admin-key
          BACKUP_ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars
      - name: Container smoke test
        env:
          POSTGRES_DB: proxyharbor
          POSTGRES_USER: proxyharbor
          POSTGRES_PASSWORD: ci-password
          ADMIN_API_KEY: ci-admin-key-at-least-24-chars
          BACKUP_ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars
          BACKGROUND_WORKERS_ENABLED: false
        run: |
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker compose logs --no-color; fi
            docker compose down --volumes
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up --detach --build
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then break; fi
            if [ "$attempt" -eq 90 ]; then exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/api/v1/stats
          metrics=$(curl --fail --silent http://127.0.0.1:8080/metrics)
          echo "$metrics" | grep 'proxyharbor_sources_enabled 81'
          echo "$metrics" | grep 'proxyharbor_source_catalog_complete 1'
          echo "$metrics" | grep 'proxyharbor_builtin_sources_expected 81'
          echo "$metrics" | grep 'proxyharbor_builtin_providers_expected 50'
          openapi_document=$(curl --fail --silent http://127.0.0.1:8080/openapi/v1.json)
          echo "$openapi_document" | jq --exit-status \
            '.components.securitySchemes.AdminApiKey.type == "apiKey" and
             (.paths["/api/v1/admin/sources"].get.security[0] | has("AdminApiKey")) and
             (.paths["/api/v1/proxies"].get.security == null)'
          curl --fail --silent http://127.0.0.1:8080/health/live
          index_html=$(curl --fail --silent http://127.0.0.1:8080/)
          asset_path=$(echo "$index_html" | grep --only-matching --extended-regexp '/assets/[^" ]+\.js' | head --lines 1)
          test -n "$asset_path"
          asset_headers=$(mktemp)
          curl --fail --silent --dump-header "$asset_headers" --output /dev/null "http://127.0.0.1:8080$asset_path"
          grep --ignore-case '^Content-Security-Policy:' "$asset_headers"
          grep --ignore-case '^X-Content-Type-Options: nosniff' "$asset_headers"
          grep --ignore-case '^Cache-Control:.*max-age=' "$asset_headers"
          rm "$asset_headers"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: proxyharbor
          POSTGRES_USER: proxyharbor
          POSTGRES_PASSWORD: integration-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proxyharbor -d proxyharbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build ProxyHarbor.slnx -c Release
      - name: PostgreSQL and encrypted backup/restore integration tests
        env:
          PROXYHARBOR_INTEGRATION_POSTGRES: Host=127.0.0.1;Port=5432;Database=proxyharbor;Username=proxyharbor;Password=integration-password
        run: dotnet test ProxyHarbor.slnx -c Release --no-build --filter Category=PostgresIntegration
      - name: Migrations and API smoke test
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5432;Database=proxyharbor;Username=proxyharbor;Password=integration-password
          Security__AdminApiKey: integration-admin-key-at-least-24-chars
          Collector__BackgroundWorkersEnabled: false
          Backup__Enabled: false
          Backup__Directory: /tmp/proxyharbor-backups
          Backup__EncryptionKey: integration-backup-key-at-least-32-chars
        run: |
          dotnet run --no-build -c Release --no-launch-profile --project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj > api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid || true; cat api.log' EXIT
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:5080/health/ready && break
            sleep 1
          done
          security_headers=$(mktemp)
          curl --fail --silent --dump-header "$security_headers" --output /dev/null http://127.0.0.1:5080/health/live
          grep --ignore-case '^X-Content-Type-Options: nosniff' "$security_headers"
          grep --ignore-case '^Content-Security-Policy:' "$security_headers"
          if grep --ignore-case '^Server:' "$security_headers"; then exit 1; fi
          unauthorized_status=$(curl --silent --dump-header "$security_headers" --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:5080/api/v1/admin/sources)
          test "$unauthorized_status" -eq 401
          grep --ignore-case '^WWW-Authenticate: ApiKey' "$security_headers"
          grep --ignore-case '^Cache-Control: no-store' "$security_headers"
          curl --silent --request OPTIONS --dump-header "$security_headers" --output /dev/null \
            --header 'Origin: http://localhost:5173' --header 'Access-Control-Request-Method: GET' \
            http://127.0.0.1:5080/api/v1/proxies
          if grep --ignore-case '^Access-Control-Allow-Origin:' "$security_headers"; then exit 1; fi
          rm "$security_headers"
          curl --fail --silent http://127.0.0.1:5080/api/v1/stats
          metrics=$(curl --fail --silent http://127.0.0.1:5080/metrics)
          echo "$metrics" | grep 'proxyharbor_sources_enabled 81'
          echo "$metrics" | grep 'proxyharbor_source_catalog_complete 1'
          echo "$metrics" | grep 'proxyharbor_builtin_sources_present 81'
          echo "$metrics" | grep 'proxyharbor_builtin_providers_present 50'
          sources=$(curl --fail --silent -H 'X-Admin-Key: integration-admin-key-at-least-24-chars' http://127.0.0.1:5080/api/v1/admin/sources)
          test "$(echo "$sources" | jq length)" -eq 81
          test "$(echo "$sources" | jq '[.[] | select(.isBuiltIn)] | length')" -eq 81
          test "$(echo "$sources" | jq '[.[].provider] | unique | length')" -eq 50
          invalid_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'X-Admin-Key: integration-admin-key-at-least-24-chars' \
            --data '{"name":"x","url":"http://127.0.0.1/list.txt","protocol":"Http"}' \
            http://127.0.0.1:5080/api/v1/admin/sources)
          test "$invalid_status" -eq 400
          invalid_list_filter=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:5080/api/v1/proxies?maxLatencyMs=0')
          test "$invalid_list_filter" -eq 400
          PGPASSWORD=integration-password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U proxyharbor -d proxyharbor <<'SQL'
          INSERT INTO "Proxies"
            ("Id", "Host", "Port", "Protocol", "Status", "LatencyMs", "ExitIp", "CountryCode", "IsAnonymous",
             "FirstSeenAt", "LastSeenAt", "LastCheckedAt", "NextCheckAt", "SuccessfulChecks", "FailedChecks",
             "ConsecutiveFailedChecks", "LastError")
          VALUES
            ('20000000-0000-0000-0000-000000000001', '8.8.4.4', 18080, 3, 1, 321, '1.0.0.1', 'DE', true,
             '2026-08-09T10:00:00Z', '2026-08-09T11:00:00Z', '2026-08-09T12:00:00Z', '2026-08-09T12:05:00Z',
             7, 2, 1, 'ci round-trip marker');
          SQL
          backup_json=$(curl --fail --silent -X POST \
            -H 'X-Admin-Key: integration-admin-key-at-least-24-chars' \
            http://127.0.0.1:5080/api/v1/admin/backup)
          backup_file=$(echo "$backup_json" | jq -r '.created')
          test -f "/tmp/proxyharbor-backups/$backup_file"
          backup_diagnostics=$(curl --fail --silent \
            -H 'X-Admin-Key: integration-admin-key-at-least-24-chars' \
            http://127.0.0.1:5080/api/v1/admin/diagnostics)
          echo "$backup_diagnostics" | jq --exit-status \
            '.sourceCatalog.isComplete == true and
             .sourceCatalog.expectedSources == 81 and
             .sourceCatalog.expectedProviders == 50 and
             .recentBackups[0].status == "completed" and
             .recentBackups[0].sizeBytes > 0 and
             .recentBackups[0].telegramConfigured == false and
             .recentBackups[0].sentToTelegram == false'
          curl --fail --silent http://127.0.0.1:5080/metrics | \
            grep 'proxyharbor_last_backup_success 1'
          PGPASSWORD=integration-password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U proxyharbor -d proxyharbor \
            -c "DELETE FROM \"Proxies\" WHERE \"Id\" = '20000000-0000-0000-0000-000000000001';"
          test "$(PGPASSWORD=integration-password psql -tAc \
            "SELECT count(*) FROM \"Proxies\" WHERE \"Id\" = '20000000-0000-0000-0000-000000000001';" \
            -h 127.0.0.1 -U proxyharbor -d proxyharbor)" -eq 0
          invalid_export_filter=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:5080/api/v1/export/json?minSuccessRate=101')
          test "$invalid_export_filter" -eq 400
          for attempt in {1..4}; do
            export_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:5080/api/v1/export/unsupported)
            test "$export_status" -eq 400
          done
          rate_headers=$(mktemp)
          export_status=$(curl --silent --dump-header "$rate_headers" --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:5080/api/v1/export/unsupported)
          test "$export_status" -eq 429
          grep --ignore-case '^Retry-After:' "$rate_headers"
          rm "$rate_headers"
          kill "$api_pid"
          wait "$api_pid" || true
          dotnet run --no-build -c Release --project src/ProxyHarbor.Restore -- \
            --input "/tmp/proxyharbor-backups/$backup_file" --replace-existing-data
          dotnet run --no-build -c Release --no-launch-profile --project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj >> api.log 2>&1 &
          api_pid=$!
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:5080/health/ready && break
            sleep 1
          done
          restored_sources=$(curl --fail --silent -H 'X-Admin-Key: integration-admin-key-at-least-24-chars' http://127.0.0.1:5080/api/v1/admin/sources)
          test "$(echo "$restored_sources" | jq length)" -eq 81
          restored_proxy=$(PGPASSWORD=integration-password psql -tA -F '|' \
            -h 127.0.0.1 -U proxyharbor -d proxyharbor \
            -c "SELECT \"Host\", \"Port\", \"Protocol\", \"Status\", \"LatencyMs\", \"ExitIp\", \"CountryCode\", \"IsAnonymous\", \"SuccessfulChecks\", \"FailedChecks\", \"ConsecutiveFailedChecks\", \"LastError\" FROM \"Proxies\" WHERE \"Id\" = '20000000-0000-0000-0000-000000000001';")
          test "$restored_proxy" = '8.8.4.4|18080|3|1|321|1.0.0.1|DE|t|7|2|1|ci round-trip marker'
