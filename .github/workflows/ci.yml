name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Verify repository history contains no secrets
        shell: pwsh
        run: ./tools/Invoke-Gitleaks.ps1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with: { dotnet-version: '10.0.302' }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '22', cache: npm, cache-dependency-path: src/proxyharbor-web/package-lock.json }
      - run: dotnet restore ProxyHarbor.slnx --locked-mode
      - name: Audit NuGet dependency graph
        run: dotnet list ProxyHarbor.slnx package --vulnerable --include-transitive --no-restore
      - run: dotnet build ProxyHarbor.slnx -c Release --no-restore
      - name: Verify EF model has a committed migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/ProxyHarbor.Infrastructure/ProxyHarbor.Infrastructure.csproj \
            --startup-project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj \
            --configuration Release --no-build
          migration_sql=$(dotnet ef migrations script \
            20260809134556_ValidationRunAudit 20260809142844_OptimizePublicQueryOrder \
            --project src/ProxyHarbor.Infrastructure/ProxyHarbor.Infrastructure.csproj \
            --startup-project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj \
            --configuration Release --no-build)
          echo "$migration_sql" | grep 'CREATE INDEX CONCURRENTLY "IX_Proxies_Alive_PublicOrder"'
          echo "$migration_sql" | grep 'DROP INDEX CONCURRENTLY IF EXISTS "IX_Proxies_Status_LatencyMs_LastCheckedAt"'
          create_line=$(echo "$migration_sql" | grep --line-number \
            'CREATE INDEX CONCURRENTLY "IX_Proxies_Alive_PublicOrder"' | cut --delimiter=: --fields=1)
          old_drop_line=$(echo "$migration_sql" | grep --line-number \
            'DROP INDEX CONCURRENTLY IF EXISTS "IX_Proxies_Status_LatencyMs_LastCheckedAt"' | cut --delimiter=: --fields=1)
          test "$create_line" -lt "$old_drop_line"
      - run: dotnet test ProxyHarbor.slnx -c Release --no-build --logger trx --collect:'XPlat Code Coverage' --results-directory TestResults
      - name: Enforce meaningful coverage floor
        shell: pwsh
        run: |
          $report = Get-ChildItem TestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) { throw 'Coverage report was not created.' }
          ./tools/Assert-Coverage.ps1 -ReportPath $report.FullName
      - name: Validate operational PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in Get-ChildItem tools -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($parseError in $errors) { Write-Error "$($script.Name): $parseError"; $failed = $true }
          }
          if ($failed) { throw 'Operational PowerShell scripts contain syntax errors.' }
      - name: Verify source-audit evidence contracts
        shell: pwsh
        run: ./tools/Test-AuditSourceFeeds.ps1
      - name: Verify built-in source endpoint catalog
        shell: pwsh
        run: ./tools/Test-BuiltInSourceEndpoints.ps1 -CatalogOnly
      - name: Verify validation-audit evidence contracts
        shell: pwsh
        run: ./tools/Test-AuditValidation.ps1
      - name: Verify release metadata contracts
        shell: pwsh
        run: ./tools/Test-ReleaseMetadata.ps1
      - name: Verify changelog and release-note contracts
        shell: pwsh
        run: ./tools/Test-ChangelogContracts.ps1
      - name: Verify backup-key Unicode contracts
        shell: pwsh
        run: ./tools/Test-BackupKeyContracts.ps1
      - name: Verify Telegram backup-part contracts
        shell: pwsh
        run: ./tools/Test-BackupPartContracts.ps1
      - name: Verify workflow supply-chain pins
        shell: pwsh
        run: ./tools/Test-WorkflowSecurity.ps1
      - name: Verify secret-scanner contracts
        shell: pwsh
        run: ./tools/Test-GitleaksContracts.ps1
      - name: Verify supply-chain scanner contracts
        shell: pwsh
        run: ./tools/Test-WorkflowSecurityContracts.ps1
      - name: Verify workflow-linter contracts
        shell: pwsh
        run: ./tools/Test-ActionlintContracts.ps1
      - name: Lint GitHub Actions workflows
        shell: pwsh
        run: ./tools/Invoke-Actionlint.ps1
      - run: npm ci
        working-directory: src/proxyharbor-web
      - run: npm audit --audit-level=moderate
        working-directory: src/proxyharbor-web
      - run: npm run lint
        working-directory: src/proxyharbor-web
      - run: npm test
        working-directory: src/proxyharbor-web
      - run: npm run build
        working-directory: src/proxyharbor-web
      - name: Docker build-context secret gate
        run: |
          cleanup_context() {
            rm -f .env src/proxyharbor-web/node_modules/proxyharbor-context-secret
            rm -rf .tmp-postgres backups
          }
          trap cleanup_context EXIT
          mkdir -p .tmp-postgres backups src/proxyharbor-web/node_modules
          printf 'DO_NOT_LEAK=super-secret-context-value\n' > .env
          printf 'database secret\n' > .tmp-postgres/context-secret
          printf 'backup secret\n' > backups/context-secret.phbackup
          printf 'dependency secret\n' > src/proxyharbor-web/node_modules/proxyharbor-context-secret
          docker build --no-cache --file - . <<'DOCKERFILE'
          FROM alpine:3.23
          COPY . /context
          RUN test -f /context/Directory.Build.props && \
              test -f /context/NuGet.Config && \
              test -f /context/global.json && \
              test -f /context/src/ProxyHarbor.Api/ProxyHarbor.Api.csproj && \
              test -f /context/src/ProxyHarbor.Api/packages.lock.json && \
              test -f /context/src/ProxyHarbor.Restore/ProxyHarbor.Restore.csproj && \
              test -f /context/src/ProxyHarbor.Restore/packages.lock.json && \
              test -f /context/src/ProxyHarbor.Infrastructure/packages.lock.json && \
              test -f /context/src/ProxyHarbor.Domain/packages.lock.json && \
              test -f /context/src/proxyharbor-web/package-lock.json && \
              test ! -e /context/.env && \
              test ! -e /context/.tmp-postgres && \
              test ! -e /context/backups && \
              test ! -e /context/src/proxyharbor-web/node_modules
          DOCKERFILE
      - name: Validate local and production container configuration
        env:
          POSTGRES_DB: proxyharbor
          POSTGRES_USER: proxyharbor
          POSTGRES_PASSWORD: ci-password
          ADMIN_API_KEY: ci-admin-key
          BACKUP_ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars
          PUBLIC_HOST: localhost
          ACME_EMAIL: ci@example.com
          TELEGRAM_BOT_TOKEN: 9000000000000000000:CI_ONLY_PLACEHOLDER_NOT_A_REAL_TOKEN
          TELEGRAM_CHAT_ID: "123456"
          PROXYHARBOR_IMAGE_PREFIX: ghcr.io/example
          PROXYHARBOR_IMAGE_TAG: 1.2.3
        run: |
          docker compose config
          production_config=$(docker compose \
            -f docker-compose.yml -f docker-compose.production.yml \
            --profile monitoring --profile tools \
            config --format json)
          echo "$production_config" | jq --exit-status '
            ((.services.web.ports // []) | length == 0) and
            .services.caddy.image == "caddy:2.11.4-alpine" and
            .services.caddy.user == "65532:65532" and
            .services.caddy.read_only == true and
            .services.caddy.healthcheck.test[0] == "CMD-SHELL" and
            (.services.caddy.healthcheck.test[1] | contains("/health/ready")) and
            .services.caddy.healthcheck.interval == "30s" and
            .services.caddy.healthcheck.timeout == "5s" and
            .services.caddy.healthcheck.start_period == "20s" and
            .services.caddy.healthcheck.retries == 3 and
            ((.services.caddy.cap_drop // []) | index("ALL") != null) and
            ([.services.caddy.ports[].published | tostring] | sort) == ["443", "443", "80"] and
            .services.prometheus.image == "prom/prometheus:v3.13.2-distroless" and
            .services.prometheus.user == "65532:65532" and
            .services.prometheus.read_only == true and
            .services.prometheus.ports[0].host_ip == "127.0.0.1" and
            .services.alertmanager.image == "prom/alertmanager:v0.32.1" and
            .services.alertmanager.user == "65534:65534" and
            .services.alertmanager.read_only == true and
            .services.alertmanager.ports[0].host_ip == "127.0.0.1" and
            (.services.alertmanager.environment | length) == 0 and
            .services.postgres.environment.POSTGRES_PASSWORD == null and
            .services.postgres.environment.POSTGRES_PASSWORD_FILE == "/run/secrets/postgres_password" and
            .services.api.environment.AllowedHosts == "localhost" and
            .services.api.environment.Security__AdminApiKey == null and
            .services.api.environment.Backup__EncryptionKey == null and
            .services.api.environment.Backup__TelegramBotToken == null and
            (.services.api.secrets | length) == 5 and
            (.services.restore.secrets | length) == 2 and
            (.services.alertmanager.secrets | length) == 2'
          for secret_value in ci-password ci-admin-key ci-encryption-key-at-least-32-chars 9000000000000000000:CI_ONLY_PLACEHOLDER_NOT_A_REAL_TOKEN 123456; do
            if echo "$production_config" | grep --fixed-strings "$secret_value"; then
              echo "Secret value leaked into rendered Compose configuration."
              exit 1
            fi
          done
          release_config=$(docker compose \
            -f docker-compose.yml -f docker-compose.release.yml -f docker-compose.production.yml \
            --profile monitoring --profile tools config --format json)
          echo "$release_config" | jq --exit-status '
            .services.api.image == "ghcr.io/example/proxyharbor-api:1.2.3" and
            .services.api.build == null and
            .services.restore.image == "ghcr.io/example/proxyharbor-restore:1.2.3" and
            .services.restore.build == null and
            .services.web.image == "ghcr.io/example/proxyharbor-web:1.2.3" and
            .services.web.build == null and
            ((.services.web.ports // []) | length == 0)'
          docker run --rm \
            --env PUBLIC_HOST=localhost --env ACME_EMAIL=ci@example.com \
            --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm --entrypoint /bin/promtool \
            --volume "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.2-distroless \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint /bin/promtool \
            --volume "$PWD/deploy/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.13.2-distroless \
            test rules /etc/prometheus/alerts.test.yml
          docker run --rm --entrypoint /bin/amtool \
            --volume "$PWD/deploy/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.32.1 \
            --enable-feature=utf8-strict-mode \
            check-config /etc/alertmanager/alertmanager.yml
          docker run --rm --entrypoint /bin/amtool \
            --volume "$PWD/deploy/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.32.1 \
            config routes test --config.file=/etc/alertmanager/alertmanager.yml \
            --verify.receivers=telegram severity=critical alertname=CriticalTest
          docker run --rm --entrypoint /bin/amtool \
            --volume "$PWD/deploy/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.32.1 \
            config routes test --config.file=/etc/alertmanager/alertmanager.yml \
            --verify.receivers=telegram severity=warning alertname=WarningTest
          rendered_alert=$(docker run --rm --entrypoint /bin/amtool \
            --volume "$PWD/deploy/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.32.1 \
            template render \
            --template.glob='/etc/alertmanager/templates/*.tmpl' \
            --template.text='{{ template "telegram.proxyharbor.message" . }}' \
            --template.type=html \
            --template.data=/etc/alertmanager/telegram.test.json \
            --no-version-check)
          echo "$rendered_alert" | grep 'Proxy&lt;Down&gt;'
          echo "$rendered_alert" | grep 'Unsafe &lt;b&gt;tag&lt;/b&gt; &amp; text'
      - name: Container smoke test
        env:
          POSTGRES_DB: proxyharbor
          POSTGRES_USER: proxyharbor
          POSTGRES_PASSWORD: ci-password
          ADMIN_API_KEY: ci-admin-key-at-least-24-chars
          BACKUP_ENCRYPTION_KEY: ci-encryption-key-at-least-32-chars
          BACKGROUND_WORKERS_ENABLED: false
          PUBLIC_HOST: localhost
          ACME_EMAIL: ci@example.com
          TELEGRAM_BOT_TOKEN: 9000000000000000000:CI_ONLY_PLACEHOLDER_NOT_A_REAL_TOKEN
          TELEGRAM_CHAT_ID: "123456"
        run: |
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose -f docker-compose.yml -f docker-compose.production.yml \
                --profile monitoring logs --no-color || true
            fi
            docker compose -f docker-compose.yml -f docker-compose.production.yml \
              --profile monitoring down --volumes --remove-orphans || true
            docker compose down --volumes --remove-orphans || true
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up --detach --build
          docker compose --profile tools build restore
          docker compose --profile tools create restore
          api_id=$(docker compose ps --quiet api)
          web_id=$(docker compose ps --quiet web)
          postgres_id=$(docker compose ps --quiet postgres)
          restore_id=$(docker compose --profile tools ps --all --quiet restore)
          assert_secret_values_absent() {
            container_id=$1
            environment=$(docker inspect --format '{{json .Config.Env}}' "$container_id")
            for secret_value in ci-password ci-admin-key-at-least-24-chars \
              ci-encryption-key-at-least-32-chars 9000000000000000000:CI_ONLY_PLACEHOLDER_NOT_A_REAL_TOKEN 123456; do
              if echo "$environment" | grep --fixed-strings "$secret_value"; then
                echo "Secret value leaked into container environment."
                exit 1
              fi
            done
          }
          assert_secret_values_absent "$api_id"
          assert_secret_values_absent "$postgres_id"
          assert_secret_values_absent "$restore_id"
          docker inspect --format '{{json .Mounts}}' "$api_id" | jq --exit-status \
            '[.[] | select(.Destination | startswith("/run/secrets/"))] | length == 5'
          docker inspect --format '{{json .Mounts}}' "$postgres_id" | jq --exit-status \
            '[.[] | select(.Destination == "/run/secrets/postgres_password")] | length == 1'
          docker inspect --format '{{json .Mounts}}' "$restore_id" | jq --exit-status \
            '[.[] | select(.Destination | startswith("/run/secrets/"))] | length == 2'
          test "$(docker inspect --format '{{.Config.User}}' "$api_id")" = 'proxyharbor'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$api_id")" = 'true'
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$api_id")" = '512'
          test "$(docker inspect --format '{{.HostConfig.Init}}' "$api_id")" = 'true'
          docker inspect --format '{{json .HostConfig.Ulimits}}' "$api_id" |
            jq --exit-status 'any(.[]; .Name == "nofile" and .Soft == 8192 and .Hard == 8192)'
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$api_id" | grep --ignore-case 'ALL'
          test "$(docker inspect --format '{{index .HostConfig.LogConfig.Config "max-size"}}' "$api_id")" = '10m'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$web_id")" = 'true'
          test "$(docker inspect --format '{{.Config.User}}' "$web_id")" = 'nginx'
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$web_id")" = '128'
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$web_id" | grep --ignore-case 'ALL'
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$postgres_id")" = '256'
          test "$(docker inspect --format '{{.Config.User}}' "$restore_id")" = 'proxyharbor'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$restore_id")" = 'true'
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$restore_id")" = '256'
          test "$(docker inspect --format '{{.HostConfig.Init}}' "$restore_id")" = 'true'
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$restore_id" | grep --ignore-case 'ALL'
          docker compose --profile tools rm --force --volumes restore
          docker compose --profile tools run --rm --no-deps restore --help | grep 'ProxyHarbor restore'
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then break; fi
            if [ "$attempt" -eq 90 ]; then exit 1; fi
            sleep 2
          done
          stats=$(curl --fail --silent http://127.0.0.1:8080/api/v1/stats)
          echo "$stats" | jq --exit-status \
            '(.alive | type) == "number" and (.byProtocol | type) == "array" and has("lastRun")'
          metrics=$(curl --fail --silent http://127.0.0.1:8080/metrics)
          echo "$metrics" | grep 'proxyharbor_sources_enabled 81'
          echo "$metrics" | grep 'proxyharbor_source_catalog_complete 1'
          echo "$metrics" | grep 'proxyharbor_builtin_catalog_audit_timestamp_seconds 1786320000'
          echo "$metrics" | grep 'proxyharbor_builtin_sources_expected 81'
          echo "$metrics" | grep 'proxyharbor_builtin_providers_expected 50'
          echo "$metrics" | grep 'proxyharbor_sources_truncated 0'
          echo "$metrics" | grep 'proxyharbor_last_collection_candidate_limit_reached 0'
          echo "$metrics" | grep 'proxyharbor_validation_attempts_last_5m 0'
          echo "$metrics" | grep 'proxyharbor_validation_last_attempt_timestamp_seconds 0'
          echo "$metrics" | grep 'proxyharbor_validation_runs_active 0'
          echo "$metrics" | grep 'proxyharbor_background_workers_enabled 0'
          echo "$metrics" | grep 'proxyharbor_collection_interval_seconds 900'
          echo "$metrics" | grep 'proxyharbor_public_freshness_seconds 900'
          echo "$metrics" | grep 'proxyharbor_validation_concurrency_limit 800'
          echo "$metrics" | grep 'proxyharbor_validation_batch_size 1600'
          echo "$metrics" | grep 'proxyharbor_validation_checks_per_second 0'
          echo "$metrics" | grep 'proxyharbor_validation_estimated_drain_seconds 0'
          echo "$metrics" | grep 'proxyharbor_backup_enabled 0'
          echo "$metrics" | grep 'proxyharbor_backup_interval_seconds 86400'
          echo "$metrics" | grep 'proxyharbor_backup_telegram_configured 0'
          openapi_document=$(curl --fail --silent http://127.0.0.1:8080/openapi/v1.json)
          echo "$openapi_document" | jq --exit-status \
            '.components.securitySchemes.AdminApiKey.type == "apiKey" and
             (.paths["/api/v1/admin/sources"].get.security[0] | has("AdminApiKey")) and
             (.paths["/api/v1/proxies"].get.security == null) and
             .paths["/api/v1/stats"].get.responses["200"].content["application/json"].schema["$ref"] ==
               "#/components/schemas/StatsResponse" and
             (.components.schemas.PublicCollectionRunResponse.properties | has("id") | not) and
             (.components.schemas.PublicCollectionRunResponse.properties | has("error") | not) and
             .paths["/api/v1/admin/validate"].post.responses["200"].content["application/json"].schema["$ref"] ==
               "#/components/schemas/ValidationTriggerResponse" and
             .paths["/api/v1/admin/backup"].post.responses["200"].content["application/json"].schema["$ref"] ==
               "#/components/schemas/BackupTriggerResponse"'
          curl --fail --silent http://127.0.0.1:8080/health/live
          index_html=$(curl --fail --silent http://127.0.0.1:8080/)
          asset_path=$(echo "$index_html" | grep --only-matching --extended-regexp '/assets/[^" ]+\.js' | head --lines 1)
          test -n "$asset_path"
          asset_headers=$(mktemp)
          curl --fail --silent --dump-header "$asset_headers" --output /dev/null "http://127.0.0.1:8080$asset_path"
          grep --ignore-case '^Content-Security-Policy:' "$asset_headers"
          grep --ignore-case '^X-Content-Type-Options: nosniff' "$asset_headers"
          grep --ignore-case '^Cache-Control:.*max-age=' "$asset_headers"
          rm "$asset_headers"
          oversized_body=$(mktemp)
          head --bytes 70000 /dev/zero | tr '\0' a > "$oversized_body"
          oversized_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header 'X-Admin-Key: ci-admin-key-at-least-24-chars' \
            --data-binary "@$oversized_body" http://127.0.0.1:8080/api/v1/admin/sources)
          rm "$oversized_body"
          test "$oversized_status" -eq 413
          # Fake Telegram secrets выше нужны для проверки secret mounts, но manual
          # backup не должен обращаться к реальному Bot API. Пересоздаём только API
          # с пустыми secret-файлами и тем самым тестируем локальный delivery-mode.
          TELEGRAM_BOT_TOKEN= TELEGRAM_CHAT_ID= docker compose \
            up --detach --no-deps --force-recreate api
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 1
          done

          backup_response=$(curl --fail --silent --request POST \
            --header 'X-Admin-Key: ci-admin-key-at-least-24-chars' \
            http://127.0.0.1:8080/api/v1/admin/backup)
          echo "$backup_response" | jq --exit-status '.sentToTelegram == false'
          backup_file=$(echo "$backup_response" | jq --raw-output '.created')
          test -n "$backup_file"
          test "$backup_file" != 'null'
          backup_diagnostics=$(curl --fail --silent \
            --header 'X-Admin-Key: ci-admin-key-at-least-24-chars' \
            http://127.0.0.1:8080/api/v1/admin/diagnostics)
          echo "$backup_diagnostics" | jq --exit-status \
            '.recentBackups[0].status == "completed" and
             .recentBackups[0].telegramConfigured == false and
             .recentBackups[0].sentToTelegram == false and
             .recentBackups[0].sizeBytes > 0'
          readiness_headers=$(mktemp)
          readiness_body=$(mktemp)
          readiness_limited=false
          for attempt in {1..130}; do
            readiness_status=$(curl --silent --dump-header "$readiness_headers" \
              --output "$readiness_body" --write-out '%{http_code}' \
              http://127.0.0.1:8080/health/ready)
            if [ "$readiness_status" -eq 429 ]; then
              readiness_limited=true
              break
            fi
            test "$readiness_status" -eq 200
          done
          test "$readiness_limited" = true
          grep --ignore-case '^Retry-After: [1-9][0-9]*' "$readiness_headers"
          jq --exit-status '.status == 429' "$readiness_body"
          curl --fail --silent http://127.0.0.1:8080/health/live
          rm "$readiness_headers" "$readiness_body"
          docker compose stop web api
          docker compose exec -T postgres psql --username proxyharbor --dbname proxyharbor \
            --set ON_ERROR_STOP=1 --command 'DELETE FROM "Sources";'
          test "$(docker compose exec -T postgres psql --username proxyharbor --dbname proxyharbor \
            --tuples-only --no-align --command 'SELECT COUNT(*) FROM "Sources";')" -eq 0
          docker compose --profile tools run --rm restore \
            --input "/app/backups/$backup_file" --replace-existing-data
          test "$(docker compose exec -T postgres psql --username proxyharbor --dbname proxyharbor \
            --tuples-only --no-align --command 'SELECT COUNT(*) FROM "Sources";')" -eq 81
          docker compose up --detach api web
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 1
          done

          # Повторяем запуск через production override и проверяем не только
          # доступность TLS, но и фактическое container hardening.
          docker compose down --volumes
          docker compose -f docker-compose.yml -f docker-compose.production.yml --profile monitoring \
            up --detach --build
          caddy_id=$(docker compose -f docker-compose.yml -f docker-compose.production.yml \
            ps --quiet caddy)
          prometheus_id=$(docker compose -f docker-compose.yml -f docker-compose.production.yml \
            --profile monitoring ps --quiet prometheus)
          alertmanager_id=$(docker compose -f docker-compose.yml -f docker-compose.production.yml \
            --profile monitoring ps --quiet alertmanager)
          test "$(docker inspect --format '{{.Config.User}}' "$caddy_id")" = '65532:65532'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$caddy_id")" = 'true'
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$caddy_id")" = '128'
          test "$(docker inspect --format '{{.HostConfig.Init}}' "$caddy_id")" = 'true'
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$caddy_id" | grep --ignore-case 'ALL'
          test "$(docker inspect --format '{{.Config.User}}' "$prometheus_id")" = '65532:65532'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$prometheus_id")" = 'true'
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$prometheus_id")" = '128'
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$prometheus_id")" = '536870912'
          test "$(docker inspect --format '{{.HostConfig.NanoCpus}}' "$prometheus_id")" = '1000000000'
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$prometheus_id" | grep --ignore-case 'ALL'
          docker port "$prometheus_id" 9090/tcp | grep '^127.0.0.1:9090$'
          test "$(docker inspect --format '{{.Config.User}}' "$alertmanager_id")" = '65534:65534'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$alertmanager_id")" = 'true'
          test "$(docker inspect --format '{{.HostConfig.PidsLimit}}' "$alertmanager_id")" = '128'
          test "$(docker inspect --format '{{.HostConfig.Memory}}' "$alertmanager_id")" = '268435456'
          test "$(docker inspect --format '{{.HostConfig.NanoCpus}}' "$alertmanager_id")" = '500000000'
          docker inspect --format '{{json .HostConfig.CapDrop}}' "$alertmanager_id" | grep --ignore-case 'ALL'
          docker port "$alertmanager_id" 9093/tcp | grep '^127.0.0.1:9093$'
          if docker inspect --format '{{json .Config.Env}}' "$alertmanager_id" | \
            grep --ignore-case 'telegram'; then exit 1; fi
          assert_secret_values_absent "$alertmanager_id"
          docker inspect --format '{{json .Mounts}}' "$alertmanager_id" | jq --exit-status \
            '[.[] | select(.Destination | startswith("/run/secrets/"))] | length == 2'
          web_port=$(docker compose -f docker-compose.yml -f docker-compose.production.yml \
            port web 80 2>/dev/null || true)
          test -z "$web_port"
          for attempt in {1..90}; do
            if curl --fail --silent --insecure --resolve localhost:443:127.0.0.1 \
              https://localhost/health/ready; then break; fi
            if [ "$attempt" -eq 90 ]; then exit 1; fi
            sleep 2
          done
          for attempt in {1..90}; do
            caddy_health=$(docker inspect --format '{{.State.Health.Status}}' "$caddy_id")
            if [ "$caddy_health" = 'healthy' ]; then break; fi
            if [ "$caddy_health" = 'unhealthy' ] || [ "$attempt" -eq 90 ]; then
              docker inspect --format '{{json .State.Health.Log}}' "$caddy_id"
              exit 1
            fi
            sleep 1
          done
          tls_headers=$(mktemp)
          curl --fail --silent --insecure --resolve localhost:443:127.0.0.1 \
            --dump-header "$tls_headers" \
            --output /dev/null https://localhost/
          grep --ignore-case '^Content-Security-Policy:' "$tls_headers"
          grep --ignore-case '^Strict-Transport-Security:' "$tls_headers"
          rm "$tls_headers"
          metrics_status=$(curl --silent --insecure --resolve localhost:443:127.0.0.1 \
            --output /dev/null --write-out '%{http_code}' https://localhost/metrics)
          test "$metrics_status" -eq 404
          redirect_headers=$(mktemp)
          redirect_status=$(curl --silent --resolve localhost:80:127.0.0.1 \
            --dump-header "$redirect_headers" \
            --output /dev/null --write-out '%{http_code}' http://localhost/)
          test "$redirect_status" -eq 308
          grep --ignore-case '^Location: https://localhost/' "$redirect_headers"
          rm "$redirect_headers"
          oversized_body=$(mktemp)
          head --bytes 70000 /dev/zero | tr '\0' a > "$oversized_body"
          oversized_status=$(curl --silent --insecure --resolve localhost:443:127.0.0.1 \
            --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header 'X-Admin-Key: ci-admin-key-at-least-24-chars' \
            --data-binary "@$oversized_body" https://localhost/api/v1/admin/sources)
          rm "$oversized_body"
          test "$oversized_status" -eq 413
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9090/-/ready; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 1
          done
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9090/api/v1/targets | jq --exit-status \
              '.data.activeTargets as $targets |
               any($targets[]; .labels.job == "proxyharbor" and .health == "up") and
               any($targets[]; .labels.job == "alertmanager" and .health == "up")'; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9090/api/v1/rules | jq --exit-status \
            '[.data.groups[].rules[] | select(.type == "alerting")] | length == 17'
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9090/api/v1/alertmanagers | jq --exit-status \
              '.data.activeAlertmanagers | any(.url | startswith("http://alertmanager:9093/"))'; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:9093/-/ready
          synthetic_start=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')
          synthetic_end=$(date --utc --date='+5 minutes' +'%Y-%m-%dT%H:%M:%SZ')
          curl --fail --silent --request POST --header 'Content-Type: application/json' \
            --data "[{\"labels\":{\"alertname\":\"ProxyHarborCiSynthetic\",\"severity\":\"warning\"},\"startsAt\":\"$synthetic_start\",\"endsAt\":\"$synthetic_end\"}]" \
            http://127.0.0.1:9093/api/v2/alerts
          curl --fail --silent \
            'http://127.0.0.1:9093/api/v2/alerts?filter=alertname%3DProxyHarborCiSynthetic' | \
            jq --exit-status 'length == 1 and .[0].labels.alertname == "ProxyHarborCiSynthetic"'
          curl --fail --silent --request POST --header 'Content-Type: application/json' \
            --data "[{\"labels\":{\"alertname\":\"ProxyHarborCiSynthetic\",\"severity\":\"warning\"},\"startsAt\":\"$synthetic_start\",\"endsAt\":\"$synthetic_start\"}]" \
            http://127.0.0.1:9093/api/v2/alerts

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: proxyharbor
          POSTGRES_USER: proxyharbor
          POSTGRES_PASSWORD: integration-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proxyharbor -d proxyharbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with: { dotnet-version: '10.0.302' }
      - run: dotnet restore ProxyHarbor.slnx --locked-mode
      - run: dotnet build ProxyHarbor.slnx -c Release --no-restore
      - name: Full suite with PostgreSQL and encrypted backup/restore integration
        env:
          PROXYHARBOR_INTEGRATION_POSTGRES: Host=127.0.0.1;Port=5432;Database=proxyharbor;Username=proxyharbor;Password=integration-password
        run: dotnet test ProxyHarbor.slnx -c Release --no-build --collect:'XPlat Code Coverage' --results-directory IntegrationTestResults
      - name: Enforce coverage with production PostgreSQL paths
        shell: pwsh
        run: |
          $report = Get-ChildItem IntegrationTestResults -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          if (-not $report) { throw 'PostgreSQL coverage report was not created.' }
          ./tools/Assert-Coverage.ps1 -ReportPath $report.FullName
      - name: Migrations and API smoke test
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5432;Database=proxyharbor;Username=proxyharbor;Password=integration-password
          Security__AdminApiKey: integration-admin-key-at-least-24-chars
          AllowedHosts: 127.0.0.1;localhost
          Collector__BackgroundWorkersEnabled: false
          Backup__Enabled: false
          Backup__Directory: /tmp/proxyharbor-backups
          Backup__EncryptionKey: integration-backup-key-at-least-32-chars
          Cors__Origins__0: https://dashboard.example
          ForwardedHeaders__KnownNetworks__0: 127.0.0.1/32
        run: |
          if Cors__Origins__0=http://dashboard.example \
            dotnet run --no-build -c Release --no-launch-profile \
              --project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj > unsafe-cors.log 2>&1; then
            cat unsafe-cors.log
            exit 1
          fi
          grep 'HTTP разрешён только в Development' unsafe-cors.log
          rm unsafe-cors.log
          if ForwardedHeaders__KnownNetworks__0=0.0.0.0/0 \
            dotnet run --no-build -c Release --no-launch-profile \
              --project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj > unsafe-forwarded-network.log 2>&1; then
            cat unsafe-forwarded-network.log
            exit 1
          fi
          grep 'минимальная маска IPv4 /8, IPv6 /24' unsafe-forwarded-network.log
          rm unsafe-forwarded-network.log
          dotnet run --no-build -c Release --no-launch-profile --project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj > api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid || true; cat api.log' EXIT
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:5080/health/ready && break
            sleep 1
          done
          security_headers=$(mktemp)
          curl --fail --silent --dump-header "$security_headers" --output /dev/null http://127.0.0.1:5080/health/live
          grep --ignore-case '^X-Content-Type-Options: nosniff' "$security_headers"
          grep --ignore-case '^Content-Security-Policy:' "$security_headers"
          if grep --ignore-case '^Server:' "$security_headers"; then exit 1; fi
          invalid_host_status=$(curl --silent --header 'Host: attacker.example' --output /dev/null \
            --write-out '%{http_code}' http://127.0.0.1:5080/health/live)
          test "$invalid_host_status" -eq 400
          unauthorized_status=$(curl --silent --dump-header "$security_headers" --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:5080/api/v1/admin/sources)
          test "$unauthorized_status" -eq 401
          grep --ignore-case '^WWW-Authenticate: ApiKey' "$security_headers"
          grep --ignore-case '^Cache-Control: no-store' "$security_headers"
          curl --silent --request OPTIONS --dump-header "$security_headers" --output /dev/null \
            --header 'Origin: https://dashboard.example' --header 'Access-Control-Request-Method: GET' \
            http://127.0.0.1:5080/api/v1/proxies
          grep --ignore-case '^Access-Control-Allow-Origin: https://dashboard.example' "$security_headers"
          curl --silent --request OPTIONS --dump-header "$security_headers" --output /dev/null \
            --header 'Origin: http://localhost:5173' --header 'Access-Control-Request-Method: GET' \
            http://127.0.0.1:5080/api/v1/proxies
          if grep --ignore-case '^Access-Control-Allow-Origin:' "$security_headers"; then exit 1; fi
          rm "$security_headers"
          stats=$(curl --fail --silent http://127.0.0.1:5080/api/v1/stats)
          echo "$stats" | jq --exit-status \
            '(.alive | type) == "number" and (.byProtocol | type) == "array" and has("lastRun")'
          openapi=$(curl --fail --silent http://127.0.0.1:5080/openapi/v1.json)
          echo "$openapi" | jq --exit-status '
            .components.securitySchemes.AdminApiKey.type == "apiKey" and
            .components.securitySchemes.AdminApiKey.name == "X-Admin-Key" and
            .paths["/api/v1/admin/sources"].post.security[0].AdminApiKey == [] and
            .paths["/api/v1/stats"].get.responses["200"].content["application/json"].schema["$ref"] ==
              "#/components/schemas/StatsResponse" and
            (.components.schemas.PublicCollectionRunResponse.properties | has("id") | not) and
            (.components.schemas.PublicCollectionRunResponse.properties | has("error") | not) and
            (.paths["/api/v1/admin/sources"].post.responses | keys | sort) == ["201", "400", "401", "409"] and
            (.paths["/api/v1/admin/sources/{id}"].put.responses | keys | sort) == ["204", "400", "401", "404", "409"] and
            (.paths["/api/v1/admin/sources/{id}"].delete.responses | keys | sort) == ["204", "401", "404", "409"] and
            .paths["/api/v1/admin/sources"].post.responses["409"].content["application/json"].schema["$ref"] ==
              "#/components/schemas/ProblemDetails" and
            .paths["/api/v1/admin/collect"].post.responses["409"].content["application/json"].schema["$ref"] ==
              "#/components/schemas/ProblemDetails" and
            .paths["/api/v1/admin/validate"].post.responses["200"].content["application/json"].schema["$ref"] ==
              "#/components/schemas/ValidationTriggerResponse" and
            .paths["/api/v1/admin/backup"].post.responses["200"].content["application/json"].schema["$ref"] ==
              "#/components/schemas/BackupTriggerResponse" and
            (.components.schemas.ValidationTriggerResponse.properties.checked.type | index("integer")) != null and
            .components.schemas.ValidationTriggerResponse.properties.checked.format == "int32" and
            (.components.schemas.ValidationTriggerResponse.properties.alive.type | index("integer")) != null and
            .components.schemas.ValidationTriggerResponse.properties.alive.format == "int32" and
            (.components.schemas.ValidationTriggerResponse.properties.deferred.type | index("integer")) != null and
            .components.schemas.ValidationTriggerResponse.properties.deferred.format == "int32" and
            .components.schemas.BackupTriggerResponse.properties.created.type == "string" and
            .components.schemas.BackupTriggerResponse.properties.sentToTelegram.type == "boolean"'
          metrics=$(curl --fail --silent http://127.0.0.1:5080/metrics)
          echo "$metrics" | grep 'proxyharbor_sources_enabled 81'
          echo "$metrics" | grep 'proxyharbor_source_catalog_complete 1'
          echo "$metrics" | grep 'proxyharbor_builtin_catalog_audit_timestamp_seconds 1786320000'
          echo "$metrics" | grep 'proxyharbor_builtin_sources_present 81'
          echo "$metrics" | grep 'proxyharbor_builtin_providers_present 50'
          echo "$metrics" | grep 'proxyharbor_sources_truncated 0'
          echo "$metrics" | grep 'proxyharbor_last_collection_candidate_limit_reached 0'
          echo "$metrics" | grep 'proxyharbor_validation_attempts_last_5m 0'
          echo "$metrics" | grep 'proxyharbor_validation_last_attempt_timestamp_seconds 0'
          echo "$metrics" | grep 'proxyharbor_validation_runs_active 0'
          echo "$metrics" | grep 'proxyharbor_validation_concurrency_limit 800'
          echo "$metrics" | grep 'proxyharbor_validation_batch_size 1600'
          echo "$metrics" | grep 'proxyharbor_validation_checks_per_second 0'
          echo "$metrics" | grep 'proxyharbor_validation_estimated_drain_seconds 0'
          sources=$(curl --fail --silent -H 'X-Admin-Key: integration-admin-key-at-least-24-chars' http://127.0.0.1:5080/api/v1/admin/sources)
          test "$(echo "$sources" | jq length)" -eq 81
          test "$(echo "$sources" | jq '[.[] | select(.isBuiltIn)] | length')" -eq 81
          test "$(echo "$sources" | jq '[.[].provider] | unique | length')" -eq 50
          invalid_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'X-Admin-Key: integration-admin-key-at-least-24-chars' \
            --data '{"name":"x","url":"http://127.0.0.1/list.txt","protocol":"Http"}' \
            http://127.0.0.1:5080/api/v1/admin/sources)
          test "$invalid_status" -eq 400
          invalid_list_filter=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:5080/api/v1/proxies?maxLatencyMs=0')
          test "$invalid_list_filter" -eq 400
          invalid_list_protocol=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:5080/api/v1/proxies?protocol=999')
          test "$invalid_list_protocol" -eq 400
          invalid_seek_protocol=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:5080/api/v1/proxies/seek?protocol=999')
          test "$invalid_seek_protocol" -eq 400
          PGPASSWORD=integration-password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U proxyharbor -d proxyharbor <<'SQL'
          INSERT INTO "Proxies"
            ("Id", "Host", "Port", "Protocol", "Status", "LatencyMs", "ExitIp", "CountryCode", "IsAnonymous",
             "FirstSeenAt", "LastSeenAt", "LastCheckedAt", "NextCheckAt", "SuccessfulChecks", "FailedChecks",
             "ConsecutiveFailedChecks", "LastError")
          VALUES
            ('20000000-0000-0000-0000-000000000001', '8.8.4.4', 18080, 3, 1, 321, '1.0.0.1', 'DE', true,
             '2026-08-09T10:00:00Z', '2026-08-09T11:00:00Z', CURRENT_TIMESTAMP, CURRENT_TIMESTAMP + interval '5 minutes',
             7, 2, 1, 'ci round-trip marker');
          SQL
          export_headers=$(mktemp)
          json_export=$(curl --fail --silent --dump-header "$export_headers" \
            --header 'Origin: https://dashboard.example' \
            'http://127.0.0.1:5080/api/v1/export/json?limit=1&offset=0')
          echo "$json_export" | jq --exit-status \
            'length == 1 and .[0].host == "8.8.4.4" and .[0].protocol == "Socks5"'
          grep --ignore-case '^Content-Type: application/json; charset=utf-8' "$export_headers"
          grep --ignore-case '^X-Export-Limit: 1' "$export_headers"
          grep --ignore-case '^X-Export-Offset: 0' "$export_headers"
          grep --ignore-case '^X-Export-Truncated: false' "$export_headers"
          grep --ignore-case '^Access-Control-Allow-Origin: https://dashboard.example' "$export_headers"
          grep --ignore-case '^Access-Control-Expose-Headers:.*X-Next-Offset' "$export_headers"
          grep --ignore-case '^Access-Control-Expose-Headers:.*X-Next-Cursor' "$export_headers"
          seek_page=$(curl --fail --silent \
            'http://127.0.0.1:5080/api/v1/proxies/seek?pageSize=1')
          echo "$seek_page" | jq --exit-status \
            '.items | length == 1 and .[0].host == "8.8.4.4"'
          xml_export=$(curl --fail --silent --dump-header "$export_headers" \
            'http://127.0.0.1:5080/api/v1/export/xml?limit=1')
          echo "$xml_export" | grep '<host>8.8.4.4</host>'
          grep --ignore-case '^Content-Type: application/xml; charset=utf-8' "$export_headers"
          txt_export=$(curl --fail --silent --dump-header "$export_headers" \
            'http://127.0.0.1:5080/api/v1/export/txt?limit=1')
          test "$txt_export" = 'socks5://8.8.4.4:18080'
          grep --ignore-case '^Content-Type: text/plain; charset=utf-8' "$export_headers"
          csv_export=$(curl --fail --silent --dump-header "$export_headers" \
            'http://127.0.0.1:5080/api/v1/export/csv?limit=1')
          echo "$csv_export" | grep '^protocol,host,port,latencyMs,successRate,lastCheckedAt,url,exitIp'
          echo "$csv_export" | grep '"Socks5","8.8.4.4",18080,321'
          grep --ignore-case '^Content-Type: text/csv; charset=utf-8' "$export_headers"
          seek_export=$(curl --fail --silent --dump-header "$export_headers" \
            'http://127.0.0.1:5080/api/v1/export/txt/seek?limit=1')
          test "$seek_export" = 'socks5://8.8.4.4:18080'
          grep --ignore-case '^X-Export-Cursor: start' "$export_headers"
          grep --ignore-case '^X-Export-Truncated: false' "$export_headers"
          rm "$export_headers"
          backup_json=$(curl --fail --silent -X POST \
            -H 'X-Admin-Key: integration-admin-key-at-least-24-chars' \
            http://127.0.0.1:5080/api/v1/admin/backup)
          backup_file=$(echo "$backup_json" | jq -r '.created')
          test -f "/tmp/proxyharbor-backups/$backup_file"
          backup_diagnostics=$(curl --fail --silent \
            -H 'X-Admin-Key: integration-admin-key-at-least-24-chars' \
            http://127.0.0.1:5080/api/v1/admin/diagnostics)
          echo "$backup_diagnostics" | jq --exit-status \
            '.sourceCatalog.isComplete == true and
             .sourceCatalog.expectedSources == 81 and
             .sourceCatalog.expectedProviders == 50 and
             .recentBackups[0].status == "completed" and
             .recentBackups[0].sizeBytes > 0 and
             .recentBackups[0].telegramConfigured == false and
             .recentBackups[0].sentToTelegram == false'
          curl --fail --silent http://127.0.0.1:5080/metrics | \
            grep 'proxyharbor_last_backup_success 1'
          PGPASSWORD=integration-password psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U proxyharbor -d proxyharbor \
            -c "DELETE FROM \"Proxies\" WHERE \"Id\" = '20000000-0000-0000-0000-000000000001';"
          test "$(PGPASSWORD=integration-password psql -tAc \
            "SELECT count(*) FROM \"Proxies\" WHERE \"Id\" = '20000000-0000-0000-0000-000000000001';" \
            -h 127.0.0.1 -U proxyharbor -d proxyharbor)" -eq 0
          # Сбрасываем in-memory token bucket после пяти успешных export smoke-запросов,
          # чтобы последующая проверка ровно пятого/шестого запроса была детерминированной.
          kill "$api_pid"
          wait "$api_pid" || true
          dotnet run --no-build -c Release --no-launch-profile --project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj >> api.log 2>&1 &
          api_pid=$!
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:5080/health/ready && break
            sleep 1
          done
          invalid_export_filter=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:5080/api/v1/export/json?minSuccessRate=101')
          test "$invalid_export_filter" -eq 400
          invalid_export_limit=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:5080/api/v1/export/json?limit=50001')
          test "$invalid_export_limit" -eq 400
          invalid_export_protocol=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:5080/api/v1/export/json?protocol=999')
          test "$invalid_export_protocol" -eq 400
          invalid_seek_export_protocol=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            'http://127.0.0.1:5080/api/v1/export/json/seek?protocol=999')
          test "$invalid_seek_export_protocol" -eq 400
          export_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:5080/api/v1/export/unsupported)
          test "$export_status" -eq 400
          # Пять отклонённых export-запросов выше исчерпали fixed-window permit limit.
          rate_headers=$(mktemp)
          export_status=$(curl --silent --dump-header "$rate_headers" --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:5080/api/v1/export/unsupported)
          test "$export_status" -eq 429
          grep --ignore-case '^Retry-After:' "$rate_headers"
          rm "$rate_headers"
          kill "$api_pid"
          wait "$api_pid" || true
          dotnet run --no-build -c Release --project src/ProxyHarbor.Restore -- \
            --input "/tmp/proxyharbor-backups/$backup_file" --replace-existing-data
          dotnet run --no-build -c Release --no-launch-profile --project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj >> api.log 2>&1 &
          api_pid=$!
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:5080/health/ready && break
            sleep 1
          done
