name: Source feed audit

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-feed-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_DB: proxyharbor
          POSTGRES_USER: proxyharbor
          POSTGRES_PASSWORD: audit-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U proxyharbor -d proxyharbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with: { dotnet-version: '10.0.302' }
      - run: dotnet restore ProxyHarbor.slnx --locked-mode
      - run: dotnet build ProxyHarbor.slnx -c Release --no-restore
      - name: Audit all built-in source feeds
        env:
          ASPNETCORE_ENVIRONMENT: Production
          ASPNETCORE_URLS: http://127.0.0.1:5080
          ConnectionStrings__Postgres: Host=127.0.0.1;Port=5432;Database=proxyharbor;Username=proxyharbor;Password=audit-password
          Security__AdminApiKey: source-audit-admin-key-at-least-24-chars
          Collector__BackgroundWorkersEnabled: false
          Collector__SourceTimeoutSeconds: 30
          Collector__ValidationConcurrency: 200
          Collector__ValidationBatchSize: 250
          Backup__Enabled: false
        run: |
          dotnet run --no-build -c Release --no-launch-profile --project src/ProxyHarbor.Api/ProxyHarbor.Api.csproj > source-audit-api.log 2>&1 &
          api_pid=$!
          cleanup() { kill "$api_pid" 2>/dev/null || true; wait "$api_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5080/health/ready; then break; fi
            if [ "$attempt" -eq 60 ]; then cat source-audit-api.log; exit 1; fi
            sleep 1
          done
          source_status=0
          pwsh -NoProfile -File ./tools/Audit-SourceFeeds.ps1 \
            -ApiBaseUrl http://127.0.0.1:5080 \
            -AdminKey source-audit-admin-key-at-least-24-chars \
            -ReportPath source-audit.json \
            -ExpectedBuiltInSources 81 \
            -ExpectedProviders 50 || source_status=$?
          validation_status=0
          pwsh -NoProfile -File ./tools/Audit-Validation.ps1 \
            -ApiBaseUrl http://127.0.0.1:5080 \
            -AdminKey source-audit-admin-key-at-least-24-chars \
            -ReportPath validation-audit.json \
            -ExportLimit 1000 || validation_status=$?
          test "$source_status" -eq 0
          test "$validation_status" -eq 0
      - name: Publish audit summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path source-audit.json) {
            $report = Get-Content source-audit.json -Raw | ConvertFrom-Json
            "## Source feed audit" >> $env:GITHUB_STEP_SUMMARY
            "- Audited: $($report.auditedAt)" >> $env:GITHUB_STEP_SUMMARY
            "- Verified current run: $($report.success)" >> $env:GITHUB_STEP_SUMMARY
            "- Success: $($report.succeeded)/$($report.enabled)" >> $env:GITHUB_STEP_SUMMARY
            "- Built-in catalog: $($report.enabledBuiltInSources)/$($report.expectedBuiltInSources)" >> $env:GITHUB_STEP_SUMMARY
            "- Providers: $($report.providers)/$($report.expectedProviders)" >> $env:GITHUB_STEP_SUMMARY
            "- Catalog complete: $($report.catalogComplete)" >> $env:GITHUB_STEP_SUMMARY
            "- Parsed entries: $($report.parsedItems)" >> $env:GITHUB_STEP_SUMMARY
            "- Failed: $($report.failed)" >> $env:GITHUB_STEP_SUMMARY
            "- Truncated feeds: $($report.truncated)" >> $env:GITHUB_STEP_SUMMARY
            "- Global candidate limit reached: $($report.candidateLimitReached)" >> $env:GITHUB_STEP_SUMMARY
            "- Collection counters match: $($report.collectionCountersMatch)" >> $env:GITHUB_STEP_SUMMARY
            "- Stale source evidence: $($report.staleEvidence)" >> $env:GITHUB_STEP_SUMMARY
            if ($report.error) { "- Error: $($report.error)" >> $env:GITHUB_STEP_SUMMARY }
          }
          if (Test-Path validation-audit.json) {
            $validation = Get-Content validation-audit.json -Raw | ConvertFrom-Json
            "## Proxy validation audit" >> $env:GITHUB_STEP_SUMMARY
            "- Success: $($validation.success)" >> $env:GITHUB_STEP_SUMMARY
            "- Attempts: $($validation.attempts)" >> $env:GITHUB_STEP_SUMMARY
            "- Checked: $($validation.checked)" >> $env:GITHUB_STEP_SUMMARY
            "- Alive: $($validation.alive)" >> $env:GITHUB_STEP_SUMMARY
            "- Deferred: $($validation.deferred)" >> $env:GITHUB_STEP_SUMMARY
            "- Published JSON/XML/TXT/CSV: $($validation.jsonRows)/$($validation.xmlRows)/$($validation.txtRows)/$($validation.csvRows)" >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Verify audit evidence artifacts exist
        if: always()
        shell: pwsh
        run: |
          $missing = @('source-audit.json', 'validation-audit.json', 'source-audit-api.log') |
            Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missing.Count -gt 0) {
            throw "Source audit did not produce required evidence: $($missing -join ', ')."
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: source-feed-audit
          path: |
            source-audit.json
            validation-audit.json
            source-audit-api.log
          if-no-files-found: error
          retention-days: 30
