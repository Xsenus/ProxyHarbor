services:
  # В production frontend доступен только через TLS gateway.
  web:
    ports: !reset []

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to the public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    user: "65532:65532"
    init: true
    pids_limit: 128
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt: [no-new-privileges:true]

volumes:
  # Сертификаты и ACME-состояние должны переживать замену контейнера.
  caddy-data:
  caddy-config:
