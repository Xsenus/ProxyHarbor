services:
  # Kestrel Host Filtering получает тот же единственный hostname, что и TLS gateway.
  api:
    environment:
      AllowedHosts: ${PUBLIC_HOST:?set PUBLIC_HOST to the public DNS name}

  # В production frontend доступен только через TLS gateway.
  web:
    ports: !reset []

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST to the public DNS name}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    healthcheck:
      # --resolve проверяет тот же SNI/Host virtual host, который обслуживает клиентов.
      test: ["CMD-SHELL", "curl --fail --silent --show-error --insecure --resolve \"$${PUBLIC_HOST}:8443:127.0.0.1\" \"https://$${PUBLIC_HOST}:8443/health/ready\" >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    user: "65532:65532"
    init: true
    pids_limit: 128
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt: [no-new-privileges:true]

  # Opt-in профиль хранит operational history и вычисляет alert rules. Web UI
  # доступен только с самого хоста либо через явно настроенный SSH tunnel.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.13.2-distroless@sha256:64f71bb84e03c855948418b0fc5dea53e9543d8e3fc9931598f583805507f05e
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}
      - --query.max-concurrency=10
      - --query.timeout=30s
      - --web.max-connections=64
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "/bin/promtool", "query", "instant", "http://127.0.0.1:9090", "vector(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [backend]
    user: "65532:65532"
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt: [no-new-privileges:true]

  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=${ALERTMANAGER_RETENTION_TIME:-120h}
      - --cluster.listen-address=
      - --enable-feature=utf8-strict-mode
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    secrets:
      - telegram_bot_token
      - telegram_chat_id
    networks: [backend]
    user: "65534:65534"
    init: true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt: [no-new-privileges:true]

volumes:
  # Сертификаты и ACME-состояние должны переживать замену контейнера.
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
