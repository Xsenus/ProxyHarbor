global:
  resolve_timeout: 5m
  # Compose передаёт секрет как отдельный read-only runtime-файл: значение не
  # попадает в конфигурацию, image metadata или persistent volume.
  telegram_bot_token_file: /run/secrets/telegram_bot_token

route:
  receiver: telegram
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Критические симптомы напоминаются чаще, пока оператор их не устранил.
    - receiver: telegram
      matchers:
        - 'severity = "critical"'
      repeat_interval: 1h

receivers:
  - name: telegram
    telegram_configs:
      - chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: HTML
        message: '{{ template "telegram.proxyharbor.message" . }}'
        # Bot token является частью Telegram URL; redirect может увести его на
        # чужой origin, поэтому следование redirect запрещено fail-closed.
        http_config:
          follow_redirects: false

templates:
  - /etc/alertmanager/templates/*.tmpl
