global:
  resolve_timeout: 5m

route:
  receiver: proxyharbor-api
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Критические симптомы напоминаются чаще, пока оператор их не устранил.
    - receiver: proxyharbor-api
      matchers:
        - 'severity = "critical"'
      repeat_interval: 1h

receivers:
  - name: proxyharbor-api
    webhook_configs:
      - url: http://api:8080/api/v1/internal/monitoring/alerts
        send_resolved: true
        max_alerts: 20
        timeout: 10s
        http_config:
          follow_redirects: false
          authorization:
            type: Bearer
            credentials_file: /run/secrets/alertmanager_webhook_token
