groups:
  - name: proxyharbor.availability
    rules:
      - alert: ProxyHarborApiDown
        expr: up{job="proxyharbor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ProxyHarbor API недоступен
          description: Prometheus не может получить /metrics API более двух минут.

      - alert: ProxyHarborAlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Alertmanager недоступен
          description: Prometheus не может передать alerts в Telegram-маршрутизатор более двух минут.

      - alert: ProxyHarborTelegramNotificationErrors
        expr: sum(increase(alertmanager_notifications_failed_total[10m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Alertmanager не доставляет уведомления
          description: За последние десять минут зарегистрированы ошибки Telegram-доставки.

      - alert: ProxyHarborAdvisoryLockCleanupFailure
        expr: increase(proxyharbor_advisory_lock_cleanup_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Ошибка освобождения PostgreSQL advisory lock
          description: Реплика исключила неоднозначную lock-сессию из pool; проверьте PostgreSQL и сетевую стабильность.

      - alert: ProxyHarborBackgroundWorkersDisabled
        expr: proxyharbor_background_workers_enabled == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Фоновые workers отключены
          description: Автоматический сбор и проверка прокси отключены в production-конфигурации.

      - alert: ProxyHarborNoPublishedProxies
        expr: proxyharbor_proxies_published == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Публичная выдача прокси пуста
          description: В API более 30 минут нет свежих проверенных прокси.

      - alert: ProxyHarborPublicApiErrorRate
        expr: |
          (
            sum(rate(proxyharbor_http_requests_total{route=~"proxies|export|stats|sources",status="5xx"}[5m]))
            /
            clamp_min(sum(rate(proxyharbor_http_requests_total{route=~"proxies|export|stats|sources"}[5m])), 0.001)
          ) > 0.05
          and
          sum(rate(proxyharbor_http_requests_total{route=~"proxies|export|stats|sources"}[5m])) > 0.1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Публичный API возвращает много 5xx
          description: Более 5% публичных запросов завершаются 5xx при устойчивой нагрузке выше 0.1 запроса/с.

      - alert: ProxyHarborPublicApiLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(proxyharbor_http_request_duration_seconds_bucket{route=~"proxies|export|stats|sources"}[5m])
            )
          ) > 2
          and
          sum(rate(proxyharbor_http_requests_total{route=~"proxies|export|stats|sources"}[5m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Публичный API превышает runtime latency SLO
          description: Совокупный p95 публичных запросов превышает 2 секунды при устойчивой нагрузке выше 0.1 запроса/с.

  - name: proxyharbor.collection
    rules:
      - alert: ProxyHarborCollectionStalled
        expr: |
          (
            proxyharbor_last_successful_collection_timestamp_seconds == 0
            or
            time() - proxyharbor_last_successful_collection_timestamp_seconds
              > 4 * proxyharbor_collection_interval_seconds
          )
          and on() proxyharbor_background_workers_enabled == 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Сбор источников остановился
          description: Успешного цикла нет дольше четырёх настроенных интервалов.

      - alert: ProxyHarborCollectionHung
        expr: proxyharbor_collection_runs_active > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: Цикл сбора выполняется слишком долго
          description: Collection run остаётся активным более 30 минут.

      - alert: ProxyHarborSourceCatalogIncomplete
        expr: proxyharbor_source_catalog_complete == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Встроенный каталог источников неполон
          description: Присутствуют или включены не все канонические feed и провайдеры.

      - alert: ProxyHarborSourceCatalogUnhealthy
        expr: proxyharbor_source_catalog_healthy == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Каталог источников длительно нездоров
          description: Не все встроенные feed имеют свежий полный успешный результат.

      - alert: ProxyHarborVpnSourceCatalogIncomplete
        expr: proxyharbor_vpn_source_catalog_complete == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Встроенный каталог VPN-источников неполон
          description: Присутствуют или включены не все канонические VPN feed и провайдеры.

      - alert: ProxyHarborVpnSourceCatalogUnhealthy
        expr: proxyharbor_vpn_source_catalog_healthy == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Каталог VPN-источников длительно нездоров
          description: Не все встроенные VPN feed имеют свежий успешный непустой результат.

      - alert: ProxyHarborCollectionTruncated
        expr: |
          proxyharbor_last_collection_candidate_limit_reached > 0
          or proxyharbor_last_collection_sources_truncated > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Результат сбора усечён защитным лимитом
          description: Увеличьте лимит только после проверки размера и корректности проблемного feed.

  - name: proxyharbor.validation
    rules:
      - alert: ProxyHarborProbeControlUnavailable
        expr: proxyharbor_probe_control_available == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: Контрольный endpoint проверки недоступен
          description: Validator работает fail-closed и не арендует очередь без доверенного control endpoint.

      - alert: ProxyHarborValidationStalled
        expr: |
          proxyharbor_validation_due > 0
          and on() proxyharbor_background_workers_enabled == 1
          and on() proxyharbor_probe_control_available == 1
          and on() proxyharbor_validation_attempts_last_5m == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Очередь проверки не обрабатывается
          description: Есть due-прокси и доступный control endpoint, но попыток проверки нет.

      - alert: ProxyHarborValidationFailures
        expr: proxyharbor_validation_runs_failed_last_5m > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Validation-партии завершаются ошибкой
          description: За последние пять минут зафиксированы failed validation runs.

      - alert: ProxyHarborValidationBacklogAtRisk
        expr: |
          proxyharbor_validation_due > 0
          and on() proxyharbor_background_workers_enabled == 1
          and on() proxyharbor_validation_estimated_drain_seconds
            > proxyharbor_public_freshness_seconds
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Validator не успевает сохранить свежесть каталога
          description: Расчётное время обработки due-очереди превышает максимальный возраст прокси в публичной выдаче.

      - alert: ProxyHarborVpnValidationStalled
        expr: |
          proxyharbor_vpn_validation_due > 0
          and on() proxyharbor_background_workers_enabled == 1
          and on() proxyharbor_vpn_validation_checked_last_5m == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Очередь проверки VPN не обрабатывается
          description: Есть due VPN-узлы и включённые workers, но за последние пять минут не завершено ни одной проверки.

      - alert: ProxyHarborVpnValidationBacklogAtRisk
        expr: |
          proxyharbor_vpn_validation_due > 0
          and on() proxyharbor_background_workers_enabled == 1
          and on() proxyharbor_vpn_validation_estimated_drain_seconds
            > proxyharbor_vpn_public_freshness_seconds
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: VPN validator не успевает сохранить свежесть каталога
          description: Расчётное время обработки due VPN-очереди превышает максимальный возраст узлов в публичной выдаче.

      - alert: ProxyHarborStaleProxyRetention
        expr: |
          proxyharbor_proxies_stale_unseen > 0
          and on() proxyharbor_background_workers_enabled == 1
        # Maintenance runs hourly. Validation can make old never-working rows
        # eligible again immediately after a successful pass, so a shorter
        # window creates a false alarm between two healthy cleanup cycles.
        for: 75m
        labels:
          severity: warning
        annotations:
          summary: Retention устаревших прокси не завершается
          description: Неарендованные, ни разу не работавшие Pending или Dead строки старше retention остаются дольше полного ежечасного цикла maintenance.

  - name: proxyharbor.maintenance
    rules:
      - alert: ProxyHarborMaintenanceFailed
        expr: proxyharbor_maintenance_healthy == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Operational maintenance не восстанавливается
          description: Последняя попытка bounded retention завершилась ошибкой и ещё не перекрыта успешным циклом.

  - name: proxyharbor.backup
    rules:
      - alert: ProxyHarborBackupConfigurationUnreadable
        expr: proxyharbor_backup_configuration_read_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Runtime-настройки backup недоступны
          description: API не может прочитать эффективные настройки backup из PostgreSQL и публикует только безопасные значения deploy-конфигурации.

      - alert: ProxyHarborBackupFailed
        expr: |
          proxyharbor_last_backup_success == 0
          and on() proxyharbor_backup_enabled == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Последний backup неуспешен
          description: Зашифрованный снимок не завершился успешно либо первый backup не был создан.

      - alert: ProxyHarborBackupStale
        expr: |
          (
            proxyharbor_last_backup_timestamp_seconds == 0
            or
            time() - proxyharbor_last_backup_timestamp_seconds
              > 1.5 * proxyharbor_backup_interval_seconds
          )
          and on() proxyharbor_backup_enabled == 1
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Backup просрочен
          description: Успешный backup не укладывается в полтора настроенных интервала.

      - alert: ProxyHarborBackupHung
        expr: proxyharbor_backup_runs_active > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: Backup выполняется слишком долго
          description: Backup run остаётся активным более одного часа.

      - alert: ProxyHarborTelegramDeliveryFailed
        expr: |
          proxyharbor_backup_enabled == 1
          and on() proxyharbor_backup_telegram_configured == 1
          and on() proxyharbor_last_backup_sent_to_telegram == 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: Backup не подтверждён Telegram
          description: Telegram настроен, но последний успешный backup не имеет подтверждённой доставки.
