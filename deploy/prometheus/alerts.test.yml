rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - name: API down respects the grace period
    interval: 1m
    input_series:
      - series: 'up{job="proxyharbor",instance="api:8080"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 1m
        alertname: ProxyHarborApiDown
        exp_alerts: []
      - eval_time: 3m
        alertname: ProxyHarborApiDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: proxyharbor
              instance: api:8080
            exp_annotations:
              summary: ProxyHarbor API недоступен
              description: Prometheus не может получить /metrics API более двух минут.

  - name: Alertmanager down is independently detected
    interval: 1m
    input_series:
      - series: 'up{job="alertmanager",instance="alertmanager:9093"}'
        values: '0x4'
    alert_rule_test:
      - eval_time: 3m
        alertname: ProxyHarborAlertmanagerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: alertmanager
              instance: alertmanager:9093
            exp_annotations:
              summary: Alertmanager недоступен
              description: Prometheus не может передать alerts в Telegram-маршрутизатор более двух минут.

  - name: Advisory lock cleanup failure is immediately visible
    interval: 1m
    input_series:
      - series: proxyharbor_advisory_lock_cleanup_failures_total
        values: '0 0 1 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: ProxyHarborAdvisoryLockCleanupFailure
        exp_alerts: []
      - eval_time: 3m
        alertname: ProxyHarborAdvisoryLockCleanupFailure
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Ошибка освобождения PostgreSQL advisory lock
              description: Реплика исключила неоднозначную lock-сессию из pool; проверьте PostgreSQL и сетевую стабильность.

  - name: Collection stall uses configured interval and worker guard
    interval: 1m
    input_series:
      - series: proxyharbor_last_successful_collection_timestamp_seconds
        values: '0x12'
      - series: proxyharbor_collection_interval_seconds
        values: '900x12'
      - series: proxyharbor_background_workers_enabled
        values: '1x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: ProxyHarborCollectionStalled
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Сбор источников остановился
              description: Успешного цикла нет дольше четырёх настроенных интервалов.

  - name: Disabled backup never raises backup alarms
    interval: 1m
    input_series:
      - series: proxyharbor_backup_enabled
        values: '0x20'
      - series: proxyharbor_backup_interval_seconds
        values: '3600x20'
      - series: proxyharbor_last_backup_success
        values: '0x20'
      - series: proxyharbor_last_backup_timestamp_seconds
        values: '0x20'
      - series: proxyharbor_backup_telegram_configured
        values: '1x20'
      - series: proxyharbor_last_backup_sent_to_telegram
        values: '0x20'
    alert_rule_test:
      - eval_time: 20m
        alertname: ProxyHarborBackupFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: ProxyHarborBackupStale
        exp_alerts: []
      - eval_time: 20m
        alertname: ProxyHarborTelegramDeliveryFailed
        exp_alerts: []

  - name: Incomplete VPN source catalog raises a critical alert after grace period
    interval: 1m
    input_series:
      - series: proxyharbor_vpn_source_catalog_complete
        values: '0x12'
    alert_rule_test:
      - eval_time: 9m
        alertname: ProxyHarborVpnSourceCatalogIncomplete
        exp_alerts: []
      - eval_time: 11m
        alertname: ProxyHarborVpnSourceCatalogIncomplete
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Встроенный каталог VPN-источников неполон
              description: Присутствуют или включены не все канонические VPN feed и провайдеры.

  - name: Unhealthy VPN source catalog warns only after a sustained hour
    interval: 5m
    input_series:
      - series: proxyharbor_vpn_source_catalog_healthy
        values: '0x15'
    alert_rule_test:
      - eval_time: 55m
        alertname: ProxyHarborVpnSourceCatalogUnhealthy
        exp_alerts: []
      - eval_time: 65m
        alertname: ProxyHarborVpnSourceCatalogUnhealthy
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Каталог VPN-источников длительно нездоров
              description: Не все встроенные VPN feed имеют свежий успешный непустой результат.

  - name: Runtime backup configuration read failure respects the grace period
    interval: 1m
    input_series:
      - series: proxyharbor_backup_configuration_read_success
        values: '0x7'
    alert_rule_test:
      - eval_time: 4m
        alertname: ProxyHarborBackupConfigurationUnreadable
        exp_alerts: []
      - eval_time: 6m
        alertname: ProxyHarborBackupConfigurationUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Runtime-настройки backup недоступны
              description: API не может прочитать эффективные настройки backup из PostgreSQL и публикует только безопасные значения deploy-конфигурации.

  - name: Runtime backup configuration recovery clears the alert
    interval: 1m
    input_series:
      - series: proxyharbor_backup_configuration_read_success
        values: '0x6 1x2'
    alert_rule_test:
      - eval_time: 7m
        alertname: ProxyHarborBackupConfigurationUnreadable
        exp_alerts: []

  - name: Enabled backup reports missing snapshot and Telegram delivery
    interval: 1m
    input_series:
      - series: proxyharbor_backup_enabled
        values: '1x16'
      - series: proxyharbor_backup_interval_seconds
        values: '3600x16'
      - series: proxyharbor_last_backup_success
        values: '0x16'
      - series: proxyharbor_last_backup_timestamp_seconds
        values: '0x16'
      - series: proxyharbor_backup_telegram_configured
        values: '1x16'
      - series: proxyharbor_last_backup_sent_to_telegram
        values: '0x16'
    alert_rule_test:
      - eval_time: 16m
        alertname: ProxyHarborBackupFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Последний backup неуспешен
              description: Зашифрованный снимок не завершился успешно либо первый backup не был создан.
      - eval_time: 16m
        alertname: ProxyHarborBackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Backup просрочен
              description: Успешный backup не укладывается в полтора настроенных интервала.
      - eval_time: 16m
        alertname: ProxyHarborTelegramDeliveryFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Backup не подтверждён Telegram
              description: Telegram настроен, но последний успешный backup не имеет подтверждённой доставки.

  - name: Validation stall requires due work healthy control and workers
    interval: 1m
    input_series:
      - series: proxyharbor_validation_due
        values: '50x16'
      - series: proxyharbor_background_workers_enabled
        values: '1x16'
      - series: proxyharbor_probe_control_available
        values: '1x16'
      - series: proxyharbor_validation_attempts_last_5m
        values: '0x16'
    alert_rule_test:
      - eval_time: 16m
        alertname: ProxyHarborValidationStalled
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Очередь проверки не обрабатывается
              description: Есть due-прокси и доступный control endpoint, но попыток проверки нет.

  - name: Validation capacity warns before published proxies become stale
    interval: 1m
    input_series:
      - series: proxyharbor_validation_due
        values: '50000x12'
      - series: proxyharbor_background_workers_enabled
        values: '1x12'
      - series: proxyharbor_validation_estimated_drain_seconds
        values: '1200x12'
      - series: proxyharbor_public_freshness_seconds
        values: '900x12'
    alert_rule_test:
      - eval_time: 9m
        alertname: ProxyHarborValidationBacklogAtRisk
        exp_alerts: []
      - eval_time: 11m
        alertname: ProxyHarborValidationBacklogAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Validator не успевает сохранить свежесть каталога
              description: Расчётное время обработки due-очереди превышает максимальный возраст прокси в публичной выдаче.

  - name: Validation capacity ignores a drain inside freshness budget
    interval: 1m
    input_series:
      - series: proxyharbor_validation_due
        values: '50000x12'
      - series: proxyharbor_background_workers_enabled
        values: '1x12'
      - series: proxyharbor_validation_estimated_drain_seconds
        values: '600x12'
      - series: proxyharbor_public_freshness_seconds
        values: '900x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: ProxyHarborValidationBacklogAtRisk
        exp_alerts: []

  - name: VPN validation stall requires due work and enabled workers
    interval: 1m
    input_series:
      - series: proxyharbor_vpn_validation_due
        values: '50000x17'
      - series: proxyharbor_background_workers_enabled
        values: '1x17'
      - series: proxyharbor_vpn_validation_checked_last_5m
        values: '0x17'
    alert_rule_test:
      - eval_time: 14m
        alertname: ProxyHarborVpnValidationStalled
        exp_alerts: []
      - eval_time: 16m
        alertname: ProxyHarborVpnValidationStalled
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Очередь проверки VPN не обрабатывается
              description: Есть due VPN-узлы и включённые workers, но за последние пять минут не завершено ни одной проверки.

  - name: VPN validation stall ignores intentionally disabled workers
    interval: 1m
    input_series:
      - series: proxyharbor_vpn_validation_due
        values: '50000x17'
      - series: proxyharbor_background_workers_enabled
        values: '0x17'
      - series: proxyharbor_vpn_validation_checked_last_5m
        values: '0x17'
    alert_rule_test:
      - eval_time: 16m
        alertname: ProxyHarborVpnValidationStalled
        exp_alerts: []

  - name: VPN validation capacity warns before published nodes become stale
    interval: 1m
    input_series:
      - series: proxyharbor_vpn_validation_due
        values: '50000x12'
      - series: proxyharbor_background_workers_enabled
        values: '1x12'
      - series: proxyharbor_vpn_validation_estimated_drain_seconds
        values: '1200x12'
      - series: proxyharbor_vpn_public_freshness_seconds
        values: '900x12'
    alert_rule_test:
      - eval_time: 9m
        alertname: ProxyHarborVpnValidationBacklogAtRisk
        exp_alerts: []
      - eval_time: 11m
        alertname: ProxyHarborVpnValidationBacklogAtRisk
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: VPN validator не успевает сохранить свежесть каталога
              description: Расчётное время обработки due VPN-очереди превышает максимальный возраст узлов в публичной выдаче.

  - name: VPN validation capacity ignores a drain inside freshness budget
    interval: 1m
    input_series:
      - series: proxyharbor_vpn_validation_due
        values: '50000x12'
      - series: proxyharbor_background_workers_enabled
        values: '1x12'
      - series: proxyharbor_vpn_validation_estimated_drain_seconds
        values: '600x12'
      - series: proxyharbor_vpn_public_freshness_seconds
        values: '900x12'
    alert_rule_test:
      - eval_time: 11m
        alertname: ProxyHarborVpnValidationBacklogAtRisk
        exp_alerts: []

  - name: Stale proxy retention survives a complete hourly maintenance interval
    interval: 1m
    input_series:
      - series: proxyharbor_proxies_stale_unseen
        values: '2x77'
      - series: proxyharbor_background_workers_enabled
        values: '1x77'
    alert_rule_test:
      - eval_time: 74m
        alertname: ProxyHarborStaleProxyRetention
        exp_alerts: []
      - eval_time: 76m
        alertname: ProxyHarborStaleProxyRetention
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Retention устаревших прокси не завершается
              description: Неарендованные, ни разу не работавшие Pending или Dead строки старше retention остаются дольше полного ежечасного цикла maintenance.

  - name: Stale proxy retention alert ignores intentionally disabled workers
    interval: 1m
    input_series:
      - series: proxyharbor_proxies_stale_unseen
        values: '2x77'
      - series: proxyharbor_background_workers_enabled
        values: '0x77'
    alert_rule_test:
      - eval_time: 76m
        alertname: ProxyHarborStaleProxyRetention
        exp_alerts: []

  - name: Operational maintenance failure remains unhealthy
    interval: 1m
    input_series:
      - series: proxyharbor_maintenance_healthy
        values: '0x16'
    alert_rule_test:
      - eval_time: 14m
        alertname: ProxyHarborMaintenanceFailed
        exp_alerts: []
      - eval_time: 16m
        alertname: ProxyHarborMaintenanceFailed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Operational maintenance не восстанавливается
              description: Последняя попытка bounded retention завершилась ошибкой и ещё не перекрыта успешным циклом.

  - name: Operational maintenance success clears older failure
    interval: 1m
    input_series:
      - series: proxyharbor_maintenance_healthy
        values: '1x16'
    alert_rule_test:
      - eval_time: 16m
        alertname: ProxyHarborMaintenanceFailed
        exp_alerts: []

  - name: Public API sustained 5xx ratio triggers after grace period
    interval: 1m
    input_series:
      - series: 'proxyharbor_http_requests_total{route="proxies",status="2xx"}'
        values: '0+10x20'
      - series: 'proxyharbor_http_requests_total{route="proxies",status="5xx"}'
        values: '0+2x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: ProxyHarborPublicApiErrorRate
        exp_alerts: []
      - eval_time: 13m
        alertname: ProxyHarborPublicApiErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Публичный API возвращает много 5xx
              description: Более 5% публичных запросов завершаются 5xx при устойчивой нагрузке выше 0.1 запроса/с.

  - name: Public API error ratio ignores sparse traffic
    interval: 1m
    input_series:
      - series: 'proxyharbor_http_requests_total{route="sources",status="5xx"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: ProxyHarborPublicApiErrorRate
        exp_alerts: []

  - name: Public API sustained slow p95 triggers after grace period
    interval: 1m
    input_series:
      - series: 'proxyharbor_http_requests_total{route="export",status="2xx"}'
        values: '0+12x22'
      - series: 'proxyharbor_http_request_duration_seconds_bucket{route="export",le="2"}'
        values: '0+0x22'
      - series: 'proxyharbor_http_request_duration_seconds_bucket{route="export",le="5"}'
        values: '0+12x22'
      - series: 'proxyharbor_http_request_duration_seconds_bucket{route="export",le="+Inf"}'
        values: '0+12x22'
    alert_rule_test:
      - eval_time: 17m
        alertname: ProxyHarborPublicApiLatency
        exp_alerts: []
      - eval_time: 18m
        alertname: ProxyHarborPublicApiLatency
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Публичный API превышает runtime latency SLO
              description: Совокупный p95 публичных запросов превышает 2 секунды при устойчивой нагрузке выше 0.1 запроса/с.

  - name: Public API healthy p95 stays below SLO
    interval: 1m
    input_series:
      - series: 'proxyharbor_http_requests_total{route="stats",status="2xx"}'
        values: '0+12x22'
      - series: 'proxyharbor_http_request_duration_seconds_bucket{route="stats",le="1"}'
        values: '0+12x22'
      - series: 'proxyharbor_http_request_duration_seconds_bucket{route="stats",le="+Inf"}'
        values: '0+12x22'
    alert_rule_test:
      - eval_time: 16m
        alertname: ProxyHarborPublicApiLatency
        exp_alerts: []
