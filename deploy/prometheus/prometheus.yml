global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    service: proxyharbor

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - scheme: http
      static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: proxyharbor
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: [api:8080]

  - job_name: alertmanager
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: [alertmanager:9093]
