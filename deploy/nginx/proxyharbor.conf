# Внешний gateway для shared-host установки, где 80/443 уже заняты системным Nginx.
# Файл подключается из http{} через sites-enabled и намеренно использует уникальные
# имена shared-memory zones, чтобы не влиять на соседние сайты сервера.
limit_req_zone $binary_remote_addr zone=proxyharbor_api_rate:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=proxyharbor_web_rate:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=proxyharbor_connections:10m;

server {
    server_name proxy.blagodaty.ru;
    server_tokens off;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 60s;
    reset_timedout_connection on;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn proxyharbor_connections 40;

    location = /metrics { return 404; }

    location ~ ^/(api|openapi|health)/ {
        limit_req zone=proxyharbor_api_rate burst=120 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Не принимаем клиентскую цепочку X-Forwarded-For как доверенную.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        limit_req zone=proxyharbor_api_rate burst=20 nodelay;
        proxy_pass http://127.0.0.1:18081/health/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        limit_req zone=proxyharbor_web_rate burst=100 nodelay;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/proxy.blagodaty.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxy.blagodaty.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name proxy.blagodaty.ru;
    return 301 https://$host$request_uri;
}
