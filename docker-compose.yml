name: proxyharbor
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    pids_limit: 256
    stop_grace_period: 1m
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: .
      dockerfile: src/ProxyHarbor.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Security__AdminApiKey: ${ADMIN_API_KEY}
      ForwardedHeaders__KnownNetworks__0: ${BACKEND_SUBNET:-172.30.0.0/24}
      Collector__BackgroundWorkersEnabled: ${BACKGROUND_WORKERS_ENABLED:-true}
      Collector__ValidationConcurrency: ${VALIDATION_CONCURRENCY:-800}
      Collector__ValidationBatchSize: ${VALIDATION_BATCH_SIZE:-1600}
      Backup__Enabled: ${BACKUP_ENABLED:-false}
      Backup__Directory: /app/backups
      Backup__HistoryRetentionDays: ${BACKUP_HISTORY_RETENTION_DAYS:-365}
      Backup__EncryptionKey: ${BACKUP_ENCRYPTION_KEY}
      Backup__TelegramBotToken: ${TELEGRAM_BOT_TOKEN:-}
      Backup__TelegramChatId: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - backups:/app/backups
    networks: [backend]
    init: true
    pids_limit: 512
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    stop_grace_period: 2m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: src/proxyharbor-web/Dockerfile
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:80"]
    networks: [backend]
    init: true
    pids_limit: 128
    stop_grace_period: 15s
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run]
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  backups:
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.0.0/24}
