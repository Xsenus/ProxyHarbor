name: proxyharbor
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    pids_limit: 256
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPU_LIMIT:-2.0}
    stop_grace_period: 1m
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: .
      dockerfile: src/ProxyHarbor.Api/Dockerfile
      args:
        VERSION: ${PROXYHARBOR_BUILD_VERSION:-0.0.0-local}
        SOURCE_REVISION: ${PROXYHARBOR_SOURCE_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER}
      SecretFiles__PostgresPassword: /run/secrets/postgres_password
      Security__AdminUsername: ${ADMIN_USERNAME:-admin}
      Security__AdminEmail: ${ADMIN_EMAIL:-admin@proxy.blagodaty.ru}
      Security__DataProtectionKeysDirectory: /app/data-protection
      SecretFiles__AdminApiKey: /run/secrets/admin_api_key
      SecretFiles__AdminPassword: /run/secrets/admin_password
      SecretFiles__SmtpPassword: ${SMTP_PASSWORD_FILE:-}
      Email__Host: ${SMTP_HOST:-}
      Email__Port: ${SMTP_PORT:-587}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__Username: ${SMTP_USERNAME:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__FromName: ${SMTP_FROM_NAME:-ProxyHarbor}
      Email__PublicBaseUrl: ${PUBLIC_BASE_URL:-https://proxy.blagodaty.ru}
      SecretFiles__BackupEncryptionKey: /run/secrets/backup_encryption_key
      SecretFiles__TelegramBotToken: /run/secrets/telegram_bot_token
      SecretFiles__TelegramChatId: /run/secrets/telegram_chat_id
      ForwardedHeaders__KnownNetworks__0: ${BACKEND_SUBNET:-172.30.0.0/24}
      Collector__BackgroundWorkersEnabled: ${BACKGROUND_WORKERS_ENABLED:-true}
      Collector__ValidationConcurrency: ${VALIDATION_CONCURRENCY:-800}
      Collector__ValidationBatchSize: ${VALIDATION_BATCH_SIZE:-1600}
      Backup__Enabled: ${BACKUP_ENABLED:-false}
      Backup__Directory: /app/backups
      Backup__HistoryRetentionDays: ${BACKUP_HISTORY_RETENTION_DAYS:-365}
      Payments__Enabled: ${PAYMENTS_ENABLED:-false}
      Payments__PublicBaseUrl: ${PUBLIC_BASE_URL:-https://proxy.blagodaty.ru}
      TelegramBot__PublicBaseUrl: ${PUBLIC_BASE_URL:-https://proxy.blagodaty.ru}
      Payments__Providers__yookassa__Enabled: ${YOOKASSA_ENABLED:-false}
      Payments__Providers__yookassa__MerchantId: ${YOOKASSA_SHOP_ID:-}
      Payments__Providers__cloudpayments__Enabled: ${CLOUDPAYMENTS_ENABLED:-false}
      Payments__Providers__cloudpayments__PublicId: ${CLOUDPAYMENTS_PUBLIC_ID:-}
      Payments__Providers__robokassa__Enabled: ${ROBOKASSA_ENABLED:-false}
      Payments__Providers__robokassa__MerchantId: ${ROBOKASSA_MERCHANT_LOGIN:-}
      Payments__Providers__robokassa__TestMode: ${ROBOKASSA_TEST_MODE:-false}
      Payments__Providers__tbank__Enabled: ${TBANK_ENABLED:-false}
      Payments__Providers__tbank__MerchantId: ${TBANK_TERMINAL_KEY:-}
      Payments__Providers__stripe__Enabled: ${STRIPE_ENABLED:-false}
      SecretFiles__YooKassaSecret: /run/secrets/yookassa_secret
      SecretFiles__CloudPaymentsSecret: /run/secrets/cloudpayments_secret
      SecretFiles__RobokassaPassword1: /run/secrets/robokassa_password1
      SecretFiles__RobokassaPassword2: /run/secrets/robokassa_password2
      SecretFiles__TBankPassword: /run/secrets/tbank_password
      SecretFiles__StripeSecret: /run/secrets/stripe_secret
      SecretFiles__StripeWebhookSecret: /run/secrets/stripe_webhook_secret
    secrets:
      - postgres_password
      - admin_api_key
      - admin_password
      - backup_encryption_key
      - telegram_bot_token
      - telegram_chat_id
      - yookassa_secret
      - cloudpayments_secret
      - robokassa_password1
      - robokassa_password2
      - tbank_password
      - stripe_secret
      - stripe_webhook_secret
    volumes:
      - backups:/app/backups
      - data-protection:/app/data-protection
    networks: [backend]
    init: true
    pids_limit: 512
    mem_limit: ${API_MEMORY_LIMIT:-2g}
    cpus: ${API_CPU_LIMIT:-2.0}
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    stop_grace_period: 2m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]

  # Одноразовый opt-in инструмент аварийного восстановления. Обычный `up`
  # его не создаёт; profile tools нужно указывать явно.
  restore:
    profiles: [tools]
    build:
      context: .
      dockerfile: src/ProxyHarbor.Restore/Dockerfile
      args:
        VERSION: ${PROXYHARBOR_BUILD_VERSION:-0.0.0-local}
        SOURCE_REVISION: ${PROXYHARBOR_SOURCE_REVISION:-unknown}
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER}
      SecretFiles__PostgresPassword: /run/secrets/postgres_password
      SecretFiles__BackupEncryptionKey: /run/secrets/backup_encryption_key
    secrets:
      - postgres_password
      - backup_encryption_key
    volumes:
      - backups:/app/backups:ro
      # Анонимный writable volume не сохраняет plaintext ZIP в постоянном backup volume.
      - /restore-temp
    networks: [backend]
    init: true
    pids_limit: 256
    mem_limit: ${RESTORE_MEMORY_LIMIT:-2g}
    cpus: ${RESTORE_CPU_LIMIT:-2.0}
    read_only: true
    cap_drop: [ALL]
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: src/proxyharbor-web/Dockerfile
      args:
        VERSION: ${PROXYHARBOR_BUILD_VERSION:-0.0.0-local}
        SOURCE_REVISION: ${PROXYHARBOR_SOURCE_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports: ["8080:8080"]
    networks: [backend]
    init: true
    pids_limit: 128
    mem_limit: ${WEB_MEMORY_LIMIT:-256m}
    cpus: ${WEB_CPU_LIMIT:-0.5}
    stop_grace_period: 15s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    logging: *bounded-logging
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  backups:
  data-protection:
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.0.0/24}

# Compose получает значения из host environment/.env и предоставляет их
# только явно перечисленным сервисам как read-only файлы /run/secrets/*.
secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  admin_api_key:
    environment: ADMIN_API_KEY
  admin_password:
    environment: ADMIN_PASSWORD
  backup_encryption_key:
    environment: BACKUP_ENCRYPTION_KEY
  telegram_bot_token:
    environment: TELEGRAM_BOT_TOKEN
  telegram_chat_id:
    environment: TELEGRAM_CHAT_ID
  yookassa_secret:
    environment: YOOKASSA_SECRET_KEY
  cloudpayments_secret:
    environment: CLOUDPAYMENTS_API_SECRET
  robokassa_password1:
    environment: ROBOKASSA_PASSWORD1
  robokassa_password2:
    environment: ROBOKASSA_PASSWORD2
  tbank_password:
    environment: TBANK_PASSWORD
  stripe_secret:
    environment: STRIPE_SECRET_KEY
  stripe_webhook_secret:
    environment: STRIPE_WEBHOOK_SECRET
