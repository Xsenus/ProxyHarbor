# Docker Compose v5 разрешает read-only service только с file-backed secrets.
# CI создаёт эти короткоживущие файлы перед smoke-тестом и удаляет в cleanup.
services:
  api:
    environment:
      # Runtime image всегда Production и обязан иметь bounded Host allowlist даже
      # в базовом (не TLS) smoke-профиле.
      AllowedHosts: ${PUBLIC_HOST:-localhost};127.0.0.1;api

secrets:
  postgres_password: !override
    file: ./.tmp-ci-secrets/postgres_password
  admin_api_key: !override
    file: ./.tmp-ci-secrets/admin_api_key
  admin_password: !override
    file: ./.tmp-ci-secrets/admin_password
  backup_encryption_key: !override
    file: ./.tmp-ci-secrets/backup_encryption_key
  telegram_bot_token: !override
    file: ./.tmp-ci-secrets/telegram_bot_token
  telegram_chat_id: !override
    file: ./.tmp-ci-secrets/telegram_chat_id
  yookassa_secret: !override
    file: ./.tmp-ci-secrets/yookassa_secret
  cloudpayments_secret: !override
    file: ./.tmp-ci-secrets/cloudpayments_secret
  robokassa_password1: !override
    file: ./.tmp-ci-secrets/robokassa_password1
  robokassa_password2: !override
    file: ./.tmp-ci-secrets/robokassa_password2
  tbank_password: !override
    file: ./.tmp-ci-secrets/tbank_password
  stripe_secret: !override
    file: ./.tmp-ci-secrets/stripe_secret
  stripe_webhook_secret: !override
    file: ./.tmp-ci-secrets/stripe_webhook_secret
