worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;
  sendfile on;
  keepalive_timeout 65;

  # Все runtime-файлы непривилегированного worker находятся на отдельном tmpfs.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $uri $robots_header {
    default "";
    ~^/(admin(?:/.*)?|account(?:/profile)?|login|register|forgot-password|reset-password)/?$ "noindex, nofollow, noarchive";
  }

  server {
    listen 8080;
    server_tokens off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # У API нет upload endpoint'ов: ограничение блокирует медленные/многомегабайтные admin-тела до Kestrel.
    client_max_body_size 64k;
    client_body_timeout 10s;

    location /api/ {
      proxy_pass http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # API доверяет ровно одному hop: входной клиентский X-Forwarded-For не наследуется.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
    }

    location /openapi/ {
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ {
      proxy_pass http://api:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /metrics {
      proxy_pass http://api:8080/metrics;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
      proxy_pass http://api:8080/health/ready;
      # Не передаём Docker DNS-имя `api` в Kestrel Host Filtering. Loopback Host
      # явно разрешён production Compose только для этого внутреннего маршрута.
      proxy_set_header Host 127.0.0.1;
    }
    # Публичные SEO-маршруты получают собственный HTML с canonical/meta/JSON-LD.
    # Неизвестные URL возвращают настоящий 404 вместо soft-404 главной страницы.
    location = / { try_files /index.html =404; }
    location ~ ^/(legal|pricing|service|offer|privacy|personal-data-consent|marketing-consent|acceptable-use|cookies|refunds|requisites)/?$ {
      try_files /$1.html =404;
    }
    # Кабинет остаётся SPA, но поисковым роботам явно запрещена индексация.
    location ~ ^/(admin(?:/.*)?|account(?:/profile)?|login|register|forgot-password|reset-password)/?$ {
      try_files /index.html =404;
    }
    location / { try_files $uri =404; }
    # Без локального add_header assets наследуют все server-level security headers.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ { expires 1y; }
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header X-Robots-Tag $robots_header always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  }
}
